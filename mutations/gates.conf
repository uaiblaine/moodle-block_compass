# Mutation spec for block_compass — run with `mdl mutate moodle-block_compass mutations/gates.conf --stack m502b`.
#
# Each line breaks ONE guard and names the test that must go red because of it. A guard
# whose mutation reddens nothing is held by no test, whatever its comment says — that is
# the finding. Run `--dry-run` first: it applies every pattern, prints the diff and
# restores without testing, which is how you see that a pattern still matches the line
# it was written for. perl interpolates $variables on both sides of s///, so a literal
# dollar in a pattern is written \$.
#
#     tag | file relative to the repo | perl script relative to this file

# --- The budget meter (classes/local/budget.php) ---------------------------------------
# Never throw: every budget test in later phases would pass against an unbounded endpoint.
budget_never_throws    | classes/local/budget.php | budget_never_throws.pl
#   -> test_assert_reads_at_most_throws_when_exceeded

# --- The block shell (block_compass.php) -----------------------------------------------
# Drop the guest gate: guests would receive the shell and a JS that calls web services.
guest_gate             | block_compass.php        | guest_gate.pl
#   -> test_a_guest_gets_nothing

# --- The first-paint web service (classes/external/get_attention.php) ------------------
# Drop the guest gate: the site's guest would get another user's-shaped payload built for
# the guest account, and the "no userid parameter, current user only" rule would be the
# only thing left standing.
get_attention_guest_gate | classes/external/get_attention.php | get_attention_guest_gate.pl
#   -> test_guests_are_refused (tests/external/get_attention_test.php)

# --- Tier 1 (classes/local/attention.php) ---------------------------------------------
# Neutralise the active-enrolment status check (the predicate stays, ORed with a tautology,
# so the placeholder is still bound and the failure is behavioural, not a dml exception):
# suspended, expired and not-yet-started enrolments would show as live courses.
attention_active_enrolment | classes/local/attention.php | attention_active_enrolment.pl
#   -> test_inactive_enrolments_are_excluded_from_every_strip_and_from_the_counts (tests/local/attention_test.php)

# Drop the enrol-instance status half of the active-enrolment predicate: a disabled
# enrolment method would keep its courses in every strip and count.
attention_instance_enabled | classes/local/attention.php | attention_instance_enabled.pl
#   -> test_inactive_enrolments_are_excluded_from_every_strip_and_from_the_counts

# Make the visibility clause unconditional: every user would see courses with visible = 0,
# which is the capability check of ADR-000 decision 12 evaluated once per request.
attention_visible_sql | classes/local/attention.php | attention_visible_sql.pl
#   -> test_invisible_courses_need_the_viewhiddencourses_capability (tests/local/attention_test.php)

# Stop excluding the courses the user archived: they would return to every strip and to
# the ghost count, and Compass and the Course overview block would disagree.
attention_not_hidden_sql | classes/local/attention.php | attention_not_hidden_sql.pl
#   -> test_hidden_courses_are_excluded_from_the_strips_and_the_counts (tests/local/attention_test.php)
#   -> test_hidden_courses_are_excluded_everywhere (tests/external/get_attention_test.php)

# Empty the NOT EXISTS on course_completions (its subquery becomes unsatisfiable, so the
# predicate is always true): a finished course would keep occupying a Continue slot.
attention_completed_exclusion | classes/local/attention.php | attention_completed_exclusion.pl
#   -> test_continue_is_ordered_by_last_access_capped_and_free_of_completed_courses (tests/local/attention_test.php)

# Drop the strip exclusivity pass: a favourited course already shown in Continue or New
# would be drawn twice, and counts.shown would exceed the cards on screen.
attention_strip_exclusivity | classes/local/attention.php | attention_strip_exclusivity.pl
#   -> test_a_course_appears_in_one_strip_only_and_favourites_refill (tests/local/attention_test.php)

# --- The details web service (classes/external/get_card_details.php) -------------------
# Drop the batch ceiling: one call could ask for every course id on the site, and each one
# loads course_modinfo — the unbounded work PLAN.md §3.3 exists to prevent.
card_details_batch_cap | classes/external/get_card_details.php | card_details_batch_cap.pl
#   -> test_more_than_the_batch_ceiling_is_refused (tests/external/get_card_details_test.php)

# --- The observers (classes/observer.php) ---------------------------------------------
# Make the course_updated observer a no-op: a renamed, moved or hidden course would keep
# serving its old coursemeta entry to every user until something else evicted it.
observer_course_updated | classes/observer.php | observer_course_updated.pl
#   -> test_course_updated_drops_only_that_course_from_the_course_layer (tests/observer_test.php)

# Make the course_category_updated observer a no-op: a renamed category would keep its old
# name in every group header, and a moved one would keep its old path — and so would every
# descendant, since nothing fires for them — so group_id() would roll courses up to the wrong
# ancestor until something else evicted the entries.
category_observer_updated | classes/observer.php | category_observer_updated.pl
#   -> test_course_category_updated_drops_only_that_category_from_the_category_layer (tests/observer_test.php)
#   -> test_moving_a_category_drops_it_and_its_descendants_from_the_category_layer (tests/observer_test.php)

# Make the course_category_deleted observer a no-op: a deleted category's entry would outlive
# it, and a course left pointing at the id would be grouped under a name that no longer exists
# instead of under "Uncategorised".
category_observer_deleted | classes/observer.php | category_observer_deleted.pl
#   -> test_course_category_deleted_drops_only_that_category_from_the_category_layer (tests/observer_test.php)
#   -> test_delete_move_drops_the_deleted_category_and_the_children_it_moved (tests/observer_test.php)

# --- The category layer (classes/local/category_meta.php) ------------------------------
# Treat every id as a miss: get_many() would query on every call, which is exactly the
# per-request read of core's request-scoped coursecatrecords cache this layer exists to
# remove, and every "categorymeta warm" bound in the budget tests would be one read higher.
# The data stays correct, so only a read count can see it.
category_meta_single_fill | classes/local/category_meta.php | category_meta_single_fill.pl
#   -> test_a_warm_get_many_costs_no_read (tests/local/category_meta_test.php)

# --- The user layer (classes/local/inventory.php) --------------------------------------
# Trust the cached entry whatever the stamp says. The statement still runs, so the read budget
# is unchanged and the failure is staleness rather than cost: an unenrolment, a suspension, a new
# star or a course opened elsewhere would never reach tier 3 until the 24 h TTL.
inventory_stamp_validation | classes/local/inventory.php | inventory_stamp_validation.pl
#   -> test_a_suspension_moves_the_stamp_and_rebuilds_the_entry (tests/local/inventory_test.php)
#   -> and every other stamp test of that file, plus
#      test_get_costs_one_read_on_a_hit_one_on_a_miss_and_two_when_the_stamp_moved

# Skip the zero-row rule: a user with no enrolments would keep the stamp derived from rows that
# do not exist — zero counts and null maxima — while the statement sees their stars and their
# last accesses, so every later hit would mismatch and refill for ever.
inventory_zero_rows | classes/local/inventory.php | inventory_zero_rows.pl
#   -> test_a_user_with_no_enrolments_stamps_the_stars_and_accesses_it_cannot_join (tests/local/inventory_test.php)

# Drop the timestart half of the read-time active rule: an enrolment whose window has not opened
# yet would be listed as a live course. This is the half no stamp can see (ADR-002, fact 1), so
# nothing else in the design catches it.
inventory_active_timestart | classes/local/inventory.php | inventory_active_timestart.pl
#   -> test_courses_follows_the_enrolment_window_at_read_time (tests/local/inventory_test.php)

# Stop excluding the courses the user archived: they would come back into tier 3 and its total,
# and Compass and the Course overview block would disagree about what is archived.
inventory_hidden_exclusion | classes/local/inventory.php | inventory_hidden_exclusion.pl
#   -> test_archiving_a_course_leaves_the_stamp_alone_and_is_excluded_at_read_time (tests/local/inventory_test.php)
#   -> test_an_archived_course_never_reaches_a_group (tests/local/explore_test.php)

# --- Tier 3 (classes/local/explore.php, classes/local/category_meta.php) -------------------
# Group every course under its own category, ignoring group_depth (the ancestor lookup lives in
# category_meta::group_id()): a site grouping at depth 1 would get one group per leaf
# subcategory, and the setting would silently do nothing.
explore_group_depth | classes/local/category_meta.php | explore_group_depth.pl
#   -> test_groups_roll_up_to_the_configured_category_depth (tests/local/explore_test.php),
#      test_group_id_returns_the_ancestor_at_the_group_depth (tests/local/category_meta_test.php)

# Make the visibility filter unconditional: every learner would see courses with visible = 0 in
# tier 3, which is the capability check of ADR-000 decision 12 evaluated once per request.
explore_visibility | classes/local/explore.php | explore_visibility.pl
#   -> test_an_invisible_course_needs_the_viewhiddencourses_capability (tests/local/explore_test.php)

# Name the fallback group with the empty string: a course whose category row is gone (a bad
# restore can do it; core's UI cannot) would sit under a group with no label — unreachable from
# the index and unannounced to a screen reader — instead of under "Uncategorised".
explore_uncategorised | classes/local/explore.php | explore_uncategorised.pl
#   -> test_a_course_whose_category_is_gone_lands_in_the_uncategorised_group (tests/local/explore_test.php)

# --- The inventory web service (classes/external/get_inventory.php) --------------------
# Drop the guest gate: the site's guest account would receive an inventory built for itself, and
# the "no userid parameter, current user only" rule would be the only thing left standing.
get_inventory_guest_gate | classes/external/get_inventory.php | get_inventory_guest_gate.pl
#   -> test_guests_are_refused (tests/external/get_inventory_test.php)

# --- Tier 3 paged mode (classes/local/explore.php) --------------------------------------
# Make the full/paged decision always choose full: the ">" comparison against inventorymax
# never fires, so a course set that must page would instead render every row in one response,
# which is exactly the unbounded payload ADR-004 exists to avoid above the threshold.
explore_paged_threshold | classes/local/explore.php | explore_paged_threshold.pl
#   -> test_the_mode_is_paged_above_inventory_max_and_full_at_it (tests/local/explore_test.php)

# Make the page size effectively unbounded: one page would return the whole group and
# hasmore would never be true, breaking the paging contract rows() promises the client.
explore_page_size | classes/local/explore.php | explore_page_size.pl
#   -> test_rows_pages_a_group_in_collator_order_without_repeats_or_gaps (tests/local/explore_test.php)

# Make the search cap unbounded: 'truncated' would never be true, so the client would believe
# every match shipped when SEARCH_LIMIT actually cut the list.
explore_search_cap | classes/local/explore.php | explore_search_cap.pl
#   -> test_search_is_capped_at_the_limit_and_says_so (tests/local/explore_test.php)

# Make the minimum-length gate pass for any query: a one- or zero-character query would search
# instead of answering empty, doing real work for a query too short to mean anything.
explore_search_min_length | classes/local/explore.php | explore_search_min_length.pl
#   -> test_a_query_shorter_than_two_characters_is_answered_empty_and_not_truncated (tests/local/explore_test.php)

# Drop the archived-course exclusion from the shared resolver: an archived course would
# reappear in its group's page and in search, exactly what hidden_courses::ids() exists to
# prevent. Distinct from inventory_hidden_exclusion (classes/local/inventory.php): that gate
# targets the inventory layer's own predicate, this one the call site in explore::resolve().
explore_rows_hidden | classes/local/explore.php | explore_rows_hidden.pl
#   -> test_an_archived_course_leaves_its_groups_page_and_the_search_until_unarchived (tests/local/explore_test.php)

# --- Pre-warming (classes/local/prewarm.php, classes/task/warm_active_users.php) --------
# Make the task's enable_prewarm guard never fire: the sweep would run even with the setting
# off, which is the one switch ADR-003 promises an administrator needs no second visit for.
prewarm_setting_gate | classes/task/warm_active_users.php | prewarm_setting_gate.pl
#   -> test_it_does_nothing_and_says_so_when_pre_warming_is_off (tests/task/warm_active_users_test.php)

# Make the time-budget comparison against $stopat never true: a run would never stop on
# budget and would warm the whole remaining window in one call instead of yielding control.
prewarm_budget_check | classes/local/prewarm.php | prewarm_budget_check.pl
#   -> test_a_budget_stop_persists_the_cursor_and_the_next_run_resumes_after_it (tests/local/prewarm_test.php)

# Make the cursor persistence after a batch a no-op: a resumed run would restart from the
# beginning instead of continuing after the last user warmed, re-warming the same users.
prewarm_cursor_write | classes/local/prewarm.php | prewarm_cursor_write.pl
#   -> test_a_budget_stop_persists_the_cursor_and_the_next_run_resumes_after_it (tests/local/prewarm_test.php)

# Drop the lastaccess window predicate from the selection SQL (the batch that actually warms
# users, not the opening count statement): a user outside the window would be warmed anyway.
prewarm_window | classes/local/prewarm.php | prewarm_window.pl
#   -> test_a_sweep_warms_the_users_in_the_window_and_nobody_else (tests/local/prewarm_test.php)

# --- The paging web service (classes/external/get_inventory_rows.php) ------------------
# Make the chip vocabulary check never reject: an invalid chip would reach explore::rows()
# instead of being refused before any work, at zero cost, as the web-service checklist requires.
rows_param_validation | classes/external/get_inventory_rows.php | rows_param_validation.pl
#   -> test_a_chip_outside_the_vocabulary_is_refused_before_any_work (tests/external/get_inventory_rows_test.php)

# Make the sort vocabulary check never reject: an invalid sort would reach explore::rows() instead
# of being refused before any work, the second half of the same guard as rows_param_validation.
rows_sort_validation | classes/external/get_inventory_rows.php | rows_sort_validation.pl
#   -> test_a_sort_outside_the_vocabulary_is_refused_before_any_work (tests/external/get_inventory_rows_test.php)

# --- The Bootstrap class scan (tests/local/bootstrap_compat_test.php) -------------------
# Stop the scan reading the React sources: every Bootstrap class name the client owns is
# moving into .tsx (ADR-006), and this scan is the only thing in any pipeline that reads a
# class name at all. A scan that quietly stops covering them keeps passing.
react_scan_coverage | tests/local/bootstrap_compat_test.php | react_scan_coverage.pl
#   -> test_the_scan_covers_templates_javascript_and_the_stylesheet (tests/local/bootstrap_compat_test.php)

# Make the React-source filter skip every file: $checked stays 0 and the vacuity guard is
# what must catch it. The badge rule proper cannot be gated yet -- reverting the className
# half of its regex reddens nothing while no .tsx writes a badge -- so that gate is owed by
# phase R2, in the commit that writes the first one.
react_literal_badge_scan | tests/local/bootstrap_compat_test.php | react_literal_badge_scan.pl
#   -> test_react_sources_write_badge_classes_as_literals (tests/local/bootstrap_compat_test.php)

# Make the markup filter skip every file, so the hidden-versus-display-utility rule reads
# nothing: the vacuity guard is what must catch it. As with the badge rule, the check
# proper cannot be gated while the tree holds no violation -- that is the point of the
# rule -- so what is gated is that it still reads the markup at all.
hidden_display_scan | tests/local/bootstrap_compat_test.php | hidden_display_scan.pl
#   -> test_nothing_hidden_also_carries_a_display_utility (tests/local/bootstrap_compat_test.php)

# Drop the className half of the badge attribute pattern, so the rule reads class= only.
# Phase R1 recorded this gate as owed by the phase that wrote the first .tsx badge; R2 did.
# It reddened the PER-LANGUAGE guard then, because a Mustache badge still survived in tier 3
# and kept the rule's own total non-zero. R3 deleted that template, so every badge the plugin
# writes is now a className and the mutation reddens both guards - which is a stronger gate,
# and a reason to keep the per-language one rather than conclude it has become redundant:
# the day a Mustache badge comes back, it is the only thing that would notice.
react_badge_classname | tests/local/bootstrap_compat_test.php | react_badge_classname.pl
#   -> test_every_badge_states_its_text_colour (tests/local/bootstrap_compat_test.php)

# --- The React mount contract (templates/block.mustache) --------------------------------
# Point the mount at a component that does not exist. Nothing in any pipeline reads the gap
# between a Mustache template and a React component - a wrong props shape shipped in R2 and
# only Behat caught it - so the least the PHPUnit shell test can do is pin the component
# name and the props keys it hands over.
mount_contract | templates/block.mustache | mount_contract.pl
#   -> test_a_logged_in_user_gets_the_shell (tests/block_compass_test.php)


# --- Lazy details and the two views (ADR-005, phase R4) ---------------------------------
# Stop warming the batch's course contexts before the images are asked for: every course in
# the batch pays a context read core would otherwise not need, and the cold budget moves
# from three reads to four.
cards_context_warming | classes/local/cards.php | cards_context_warming.pl
#   -> test_the_cold_image_is_the_calls_new_variable_cost (tests/external/get_card_details_test.php)

# Drop imageurl from the return allowlist: clean_returnvalue() strips an undeclared key in
# silence, so the cards view would draw placeholders for every course and nothing anywhere
# would say why.
card_details_image_allowlist | classes/external/get_card_details.php | card_details_image_allowlist.pl
#   -> test_the_image_travels_with_the_details (tests/external/get_card_details_test.php)

# Return the stored default_view unchecked: a value from an upgrade, a restore or a
# hand-edited table reaches the client, which draws no rows for a view it does not know.
config_default_view | classes/local/config.php | config_default_view.pl
#   -> test_the_default_view_is_list_unless_cards_is_stored (tests/local/config_test.php)

# The same guard on the viewer's own preference: set_user_preference() writes what it is
# given and only the endpoints clean, so the shell is where a stored word outside the
# vocabulary has to stop.
block_view_vocabulary | classes/output/block.php | block_view_vocabulary.pl
#   -> test_the_view_the_shell_ships_is_the_viewers_own_or_the_site_default (tests/block_compass_test.php)

# Drop the choices entry from the preference definition: PARAM_ALPHA alone accepts any run
# of letters, so core's endpoint would store one and the block would render nothing.
preference_choices | lib.php | preference_choices.pl
#   -> test_a_view_outside_the_vocabulary_does_not_survive_cleaning (tests/lib_test.php)

# Swap the permission callback for one that is true of any real user: another user's view
# preference becomes writable through core's own endpoint.
preference_permission | lib.php | preference_permission.pl
#   -> test_only_the_viewer_may_write_their_own_view (tests/lib_test.php)

# Declare the metadata provider alone: the component stops being compliant, because core
# counts a component compliant only when it also implements a DATA provider — and nothing
# in this plugin's pipeline runs core's own sweep, so the plugin's own test is the guard.
privacy_data_provider | classes/privacy/provider.php | privacy_data_provider.pl
#   -> test_the_component_is_compliant (tests/privacy/provider_test.php)
