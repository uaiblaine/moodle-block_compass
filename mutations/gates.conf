category_observer_deleted | classes/observer.php | category_observer_deleted.pl
#   -> test_course_category_deleted_drops_only_that_category_from_the_category_layer (tests/observer_test.php)
#   -> test_delete_move_drops_the_deleted_category_and_the_children_it_moved (tests/observer_test.php)

# --- The category layer (classes/local/category_meta.php) ------------------------------
# Treat every id as a miss: get_many() would query on every call, which is exactly the
# per-request read of core's request-scoped coursecatrecords cache this layer exists to
# remove, and every "categorymeta warm" bound in the budget tests would be one read higher.
# The data stays correct, so only a read count can see it.
category_meta_single_fill | classes/local/category_meta.php | category_meta_single_fill.pl
#   -> test_a_warm_get_many_costs_no_read (tests/local/category_meta_test.php)

# --- The user layer (classes/local/inventory.php) --------------------------------------
# Trust the cached entry whatever the stamp says. The statement still runs, so the read budget
# is unchanged and the failure is staleness rather than cost: an unenrolment, a suspension, a new
# star or a course opened elsewhere would never reach tier 3 until the 24 h TTL.
inventory_stamp_validation | classes/local/inventory.php | inventory_stamp_validation.pl
#   -> test_a_suspension_moves_the_stamp_and_rebuilds_the_entry (tests/local/inventory_test.php)
#   -> and every other stamp test of that file, plus
#      test_get_costs_one_read_on_a_hit_one_on_a_miss_and_two_when_the_stamp_moved

# Skip the zero-row rule: a user with no enrolments would keep the stamp derived from rows that
# do not exist — zero counts and null maxima — while the statement sees their stars and their
# last accesses, so every later hit would mismatch and refill for ever.
inventory_zero_rows | classes/local/inventory.php | inventory_zero_rows.pl
#   -> test_a_user_with_no_enrolments_stamps_the_stars_and_accesses_it_cannot_join (tests/local/inventory_test.php)

# Take every row as active instead of asking the provider for ENROLLED: an enrolment whose
# window has not opened yet, or has closed, would be listed as a live course. The window is the
# half no stamp can see (ADR-002, fact 1), so nothing else in the design catches it (ADR-013).
inventory_active_is_enrolled | classes/local/inventory.php | inventory_active_is_enrolled.pl
#   -> test_courses_follows_the_enrolment_window_at_read_time (tests/local/inventory_test.php)

# Stop excluding the courses the user archived (the predicate is the complement test since
# ADR-007; neutralised, every course is in both populations): they would come back into tier 3
# and its total, and Compass and the Course overview block would disagree about what is archived.
inventory_hidden_exclusion | classes/local/inventory.php | inventory_hidden_exclusion.pl
#   -> test_archiving_a_course_leaves_the_stamp_alone_and_is_excluded_at_read_time (tests/local/inventory_test.php)
#   -> test_an_archived_course_moves_to_the_archived_group_as_a_header_alone (tests/local/explore_test.php)

