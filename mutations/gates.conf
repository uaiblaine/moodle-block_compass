# Mutation spec for block_compass — run with `mdl mutate moodle-block_compass mutations/gates.conf --stack m502b`.
#
# Each line breaks ONE guard and names the test that must go red because of it. A guard
# whose mutation reddens nothing is held by no test, whatever its comment says — that is
# the finding. Run `--dry-run` first: it applies every pattern, prints the diff and
# restores without testing, which is how you see that a pattern still matches the line
# it was written for. perl interpolates $variables on both sides of s///, so a literal
# dollar in a pattern is written \$.
#
#     tag | file relative to the repo | perl script relative to this file

# --- The budget meter (classes/local/budget.php) ---------------------------------------
# Never throw: every budget test in later phases would pass against an unbounded endpoint.
budget_never_throws    | classes/local/budget.php | budget_never_throws.pl
#   -> test_assert_reads_at_most_throws_when_exceeded

# --- The block shell (block_compass.php) -----------------------------------------------
# Drop the guest gate: guests would receive the shell and a JS that calls web services.
guest_gate             | block_compass.php        | guest_gate.pl
#   -> test_a_guest_gets_nothing

# --- The first-paint web service (classes/external/get_attention.php) ------------------
# Drop the guest gate: the site's guest would get another user's-shaped payload built for
# the guest account, and the "no userid parameter, current user only" rule would be the
# only thing left standing.
get_attention_guest_gate | classes/external/get_attention.php | get_attention_guest_gate.pl
#   -> test_guests_are_refused (tests/external/get_attention_test.php)

# --- Tier 1 (classes/local/attention.php) ---------------------------------------------
# Neutralise the active-enrolment status check (the predicate stays, ORed with a tautology,
# so the placeholder is still bound and the failure is behavioural, not a dml exception):
# suspended, expired and not-yet-started enrolments would show as live courses.
attention_active_enrolment | classes/local/attention.php | attention_active_enrolment.pl
#   -> test_inactive_enrolments_are_excluded_from_every_strip_and_from_the_counts (tests/local/attention_test.php)

# Drop the enrol-instance status half of the active-enrolment predicate: a disabled
# enrolment method would keep its courses in every strip and count.
attention_instance_enabled | classes/local/attention.php | attention_instance_enabled.pl
#   -> test_inactive_enrolments_are_excluded_from_every_strip_and_from_the_counts

# Make the visibility clause unconditional: every user would see courses with visible = 0,
# which is the capability check of ADR-000 decision 12 evaluated once per request.
attention_visible_sql | classes/local/attention.php | attention_visible_sql.pl
#   -> test_invisible_courses_need_the_viewhiddencourses_capability (tests/local/attention_test.php)

# Stop excluding the courses the user archived: they would return to every strip and to
# the ghost count, and Compass and the Course overview block would disagree.
attention_not_hidden_sql | classes/local/attention.php | attention_not_hidden_sql.pl
#   -> test_hidden_courses_are_excluded_from_the_strips_and_the_counts (tests/local/attention_test.php)
#   -> test_hidden_courses_are_excluded_everywhere (tests/external/get_attention_test.php)

# Empty the NOT EXISTS on course_completions (its subquery becomes unsatisfiable, so the
# predicate is always true): a finished course would keep occupying a Continue slot.
attention_completed_exclusion | classes/local/attention.php | attention_completed_exclusion.pl
#   -> test_continue_is_ordered_by_last_access_capped_and_free_of_completed_courses (tests/local/attention_test.php)

# Drop the strip exclusivity pass: a favourited course already shown in Continue or New
# would be drawn twice, and counts.shown would exceed the cards on screen.
attention_strip_exclusivity | classes/local/attention.php | attention_strip_exclusivity.pl
#   -> test_a_course_appears_in_one_strip_only_and_favourites_refill (tests/local/attention_test.php)

# --- The details web service (classes/external/get_card_details.php) -------------------
# Drop the batch ceiling: one call could ask for every course id on the site, and each one
# loads course_modinfo — the unbounded work PLAN.md §3.3 exists to prevent.
card_details_batch_cap | classes/external/get_card_details.php | card_details_batch_cap.pl
#   -> test_more_than_the_batch_ceiling_is_refused (tests/external/get_card_details_test.php)

# --- The observers (classes/observer.php) ---------------------------------------------
# Make the course_updated observer a no-op: a renamed, moved or hidden course would keep
# serving its old coursemeta entry to every user until something else evicted it.
observer_course_updated | classes/observer.php | observer_course_updated.pl
#   -> test_course_updated_drops_only_that_course_from_the_course_layer (tests/observer_test.php)
