card_details_batch_cap | classes/external/get_card_details.php | card_details_batch_cap.pl
#   -> test_more_than_the_batch_ceiling_is_refused (tests/external/get_card_details_test.php)

# --- The observers (classes/observer.php) ---------------------------------------------
# Make the course_updated observer a no-op: a renamed, moved or hidden course would keep
# serving its old coursemeta entry to every user until something else evicted it.
observer_course_updated | classes/observer.php | observer_course_updated.pl
#   -> test_course_updated_drops_only_that_course_from_the_course_layer (tests/observer_test.php)

# Make the course_category_updated observer a no-op: a renamed category would keep its old
# name in every group header, and a moved one would keep its old path — and so would every
