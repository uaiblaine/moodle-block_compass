# ancestor until something else evicted the entries.
category_observer_updated | classes/observer.php | category_observer_updated.pl
#   -> test_course_category_updated_drops_only_that_category_from_the_category_layer (tests/observer_test.php)
#   -> test_moving_a_category_drops_it_and_its_descendants_from_the_category_layer (tests/observer_test.php)

# Make the course_category_deleted observer a no-op: a deleted category's entry would outlive
