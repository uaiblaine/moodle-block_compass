<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass strip that scrolls</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.cc-root{
  --cc-page:#f4f5f7;--cc-surface:#fff;--cc-surface-2:#f6f7f9;--cc-text:#1d2125;--cc-text-2:#454c53;--cc-muted:#68717a;
  --cc-line:#e4e7eb;--cc-line-2:#d5dade;--cc-accent:#0f6cbf;--cc-on-accent:#fff;--cc-danger:#ca3120;--cc-warn:#f0ad4e;
  --cc-ink:#121518;--cc-on-ink:#fff;--cc-hatch:#d4d9de;--cc-control:#6a737b;
  --cc-h1:color-mix(in oklab,var(--cc-warn) 17%,var(--cc-surface));
  --cc-h2:color-mix(in oklab,var(--cc-warn) 36%,var(--cc-surface));
  --cc-h3:color-mix(in oklab,var(--cc-warn) 62%,var(--cc-surface));
  --cc-h4:color-mix(in oklab,var(--cc-warn) 92%,var(--cc-surface));
  --cc-shadow:0 28px 64px -18px rgba(16,24,40,.32),0 3px 10px rgba(16,24,40,.08);
  --activityassessment:#f90086;--activitycollaboration:#5b40ff;--activitycommunication:#eb6200;--activitycontent:#0099ad;
  font-family:'Noto Sans',system-ui,sans-serif;background:var(--cc-page);color:var(--cc-text);
  font-variant-numeric:tabular-nums;font-size:15px;line-height:1.45;
}
.cc-root.cc-dark{
  --cc-page:#0f1113;--cc-surface:#1a1d20;--cc-surface-2:#22262a;--cc-text:#eceef0;--cc-text-2:#c4c9ce;--cc-muted:#99a1a9;
  --cc-line:#2c3135;--cc-line-2:#3a4045;--cc-danger:#ff7b6b;--cc-warn:#f2b45c;--cc-control:#99a1a9;
  --cc-accent:color-mix(in oklab,#0f6cbf 35%,#eceef0);--cc-on-accent:#0b1a29;
  --cc-h3:color-mix(in oklab,var(--cc-warn) 80%,var(--cc-surface));
  --cc-ink:#f3f4f6;--cc-on-ink:#111417;--cc-hatch:#353b40;
  --cc-shadow:0 28px 64px -18px rgba(0,0,0,.7),0 3px 10px rgba(0,0,0,.4);
}
.cc-root,.cc-root *{box-sizing:border-box}
.cc-root button{font:inherit;color:inherit}
.cc-root :focus-visible{outline:2px solid var(--cc-accent);outline-offset:3px}
.cc-root a{color:var(--cc-accent)}
.sx-calm *{transition:none!important;animation:none!important}

/* Canvas furniture (as Slim.dc.html) */
.panel{background:var(--cc-surface);border:1px solid var(--cc-line);border-radius:16px;padding:26px 28px}
.sx-panel{margin-top:28px}
.kicker{font-size:12.5px;font-weight:600;color:var(--cc-accent);margin:0 0 4px}
.h{margin:0 0 6px;font-size:21px;font-weight:600;letter-spacing:-.01em}
.h1t{margin:0 0 8px;font-size:30px;font-weight:700;letter-spacing:-.015em}
.p{margin:0;color:var(--cc-text-2);font-size:14px;line-height:1.55}
.sx-lead{max-width:980px;margin-bottom:18px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--cc-surface-2);border:1px solid var(--cc-line);color:var(--cc-text-2)}
.tag--rec{background:var(--cc-accent);border-color:var(--cc-accent);color:var(--cc-on-accent)}
.tag--old{border-style:dashed}
.tag--q{background:transparent;border-color:var(--cc-warn);color:var(--cc-text)}
.notes{margin:0;padding-left:18px;font-size:13.5px;color:var(--cc-text-2);line-height:1.55;display:flex;flex-direction:column;gap:6px}
.notes b{color:var(--cc-text);font-weight:600}
.notes code,.p code,td code,.sx-mono{font-size:12.5px;background:var(--cc-surface-2);border:1px solid var(--cc-line);border-radius:4px;padding:0 4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--cc-muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--cc-line);vertical-align:bottom}
table.t td{padding:9px 10px;border-bottom:1px solid var(--cc-line);color:var(--cc-text-2);vertical-align:top}
table.t td b{color:var(--cc-text);font-weight:600}
.num{width:22px;height:22px;border-radius:50%;background:var(--cc-ink);color:var(--cc-on-ink);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.pin{position:absolute;z-index:9;box-shadow:0 0 0 2px var(--cc-surface)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card-s{border:1px solid var(--cc-line);border-radius:12px;padding:14px 16px;background:var(--cc-surface)}
.card-s h3{margin:0 0 6px;font-size:15px;font-weight:600}
.ask{display:flex;gap:12px;align-items:flex-start}
.ask p{margin:0}
.ask .q{font-size:13.5px;color:var(--cc-muted);font-style:italic}

/* Figures: a strip frame and its notes */
.sx-body{display:flex;flex-direction:column;gap:30px}
.sx-body--row{flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:40px}
.sx-fig{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.sx-fig--below{grid-template-columns:minmax(0,1fr)}
.sx-fig--solo{grid-template-columns:auto}
.sx-figtitle{margin:0 0 8px;font-size:13.5px;font-weight:600;color:var(--cc-text);display:flex;gap:8px;align-items:center}
.sx-fignotes{padding-top:30px}
.sx-fig--below .sx-fignotes{padding-top:0;max-width:1000px}
.sx-spacer{display:block}

/* The block around the strip; its content box is the strip's measured width */
.sx-block{background:var(--cc-surface);border:1px solid var(--cc-line);border-radius:14px;padding:14px 16px 12px;color:var(--cc-text)}
.sx-strip{position:relative}
.sx-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px}
.sx-toggle{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0 8px 0 2px;border-radius:9px;font-size:16px;font-weight:600;min-height:38px;cursor:pointer}
.sx-chev{color:var(--cc-control)}
.sx-month{margin:0;font-size:18px;font-weight:600;min-width:15.5rem}
.sx-month--c{min-width:12rem;text-align:center}
.sx-narrow .sx-month{min-width:0;font-size:16px;flex:1 1 auto}
.sx-today,.sx-iconbtn{display:inline-flex;align-items:center;justify-content:center;height:38px;min-width:38px;padding:0 12px;border:1px solid var(--cc-control);border-radius:10px;background:var(--cc-surface);font-size:13px;cursor:pointer;color:var(--cc-text)}
.sx-iconbtn{padding:0}
.sx-today[aria-disabled="true"],.sx-iconbtn[aria-disabled="true"]{opacity:.65;cursor:default}
.sx-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sx-seg{display:inline-flex;background:var(--cc-surface-2);border:1px solid var(--cc-line);border-radius:10px;padding:3px}
.sx-segbtn{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:13px;color:var(--cc-text-2);min-height:30px}
.sx-segbtn[aria-pressed="true"]{background:var(--cc-surface);color:var(--cc-accent);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.sx-narrow .sx-seg{display:flex;margin-top:8px}
.sx-narrow .sx-segbtn{flex:1 1 0;min-height:36px}
.sx-callink{width:38px;height:38px;border-radius:10px;border:1px solid var(--cc-control);display:grid;place-items:center;color:var(--cc-accent)}

/* The row: a native horizontal scroller between two reserved edge zones */
.sx-daysbox{position:relative;margin-top:12px}
.sx-scroller{display:grid;grid-auto-flow:column;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;padding-top:12px;padding-bottom:6px;align-items:start}
.sx-scroller::-webkit-scrollbar{display:none}
.sx-narrow .sx-scroller{scrollbar-width:thin;padding-bottom:8px}
.sx-narrow .sx-scroller::-webkit-scrollbar{display:block;height:6px}
.sx-col{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:start;transition:opacity 180ms}
.sx-col--dim{opacity:.28}
.sx-needle{position:absolute;top:-11px;left:50%;width:10px;height:8px;margin-left:-5px;background:var(--cc-accent);clip-path:polygon(0 0,100% 0,50% 100%)}
.sx-day{position:relative;border-radius:50%;border:0;display:grid;place-items:center;font-size:16px;font-weight:600;cursor:pointer;background:transparent;color:var(--cc-text);padding:0;transition:background-color 160ms,box-shadow 160ms}
.sx-hit:hover .sx-day.h0:not(.off):not(.hol),.sx-grid21 .sx-day.h0:not(.off):not(.hol):hover{background:var(--cc-surface-2)}
/* The button is the 44 px target; the disc inside it is 36 px, so the gaps between discs breathe. */
.sx-hit{position:relative;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;padding:0;cursor:pointer}
.sx-hit.kfocus{outline:2px solid var(--cc-accent);outline-offset:1px}
.sx-day.h1{background:var(--cc-h1)}.sx-day.h2{background:var(--cc-h2)}.sx-day.h3{background:var(--cc-h3)}.sx-day.h4{background:var(--cc-h4)}
.cc-dark .sx-day.h3,.cc-dark .sx-day.h4{color:#1d2125}
.sx-day.off{background:repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 6px);color:var(--cc-muted)}
.sx-day.hol{background:repeating-linear-gradient(45deg,var(--cc-hatch) 0 1px,transparent 1px 6px),repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 6px);color:var(--cc-muted)}
.sx-day.past{color:var(--cc-muted)}
.sx-day.today{background:var(--cc-ink);color:var(--cc-on-ink)}
.sx-day.today.halo2{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3.5px var(--cc-h2)}
.sx-day.today.halo3{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3.5px var(--cc-h3)}
.sx-day.today.halo4{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3.5px var(--cc-h4)}
.sx-day.soon{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3px var(--cc-accent)}
.sx-day.open{box-shadow:0 0 0 2px var(--cc-surface),0 0 0 4px var(--cc-text-2)}
.sx-day.pinned{box-shadow:0 0 0 2px var(--cc-surface),0 0 0 4px var(--cc-accent)}
.sx-day.kfocus{outline:2px solid var(--cc-accent);outline-offset:3px}
.sx-num{position:relative;z-index:1}
.sx-dots{display:flex;gap:3px;height:9px;align-items:center;white-space:nowrap}
.sx-more{font-size:10px;line-height:9px;color:var(--cc-muted);font-weight:600;margin-left:2px}
/* A phone's column is 38 px: four slots still fit, a little tighter. */
.sx-narrow .sx-dots{gap:2px}
.sx-narrow .sx-dots .mk{width:6px;height:6px}
.sx-narrow .sx-more{margin-left:1px;font-size:9.5px}
.sx-wd{font-size:12.5px;color:var(--cc-muted);line-height:16px;position:relative}
.sx-wd--today{color:var(--cc-text);font-weight:700}
.sx-wd--off::after,.sx-wd--hol::after{content:"";position:absolute;left:-5px;right:-5px;bottom:-6px;height:4px;border-radius:2px}
.sx-wd--off::after{background:repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 4px)}
.sx-wd--hol::after{background:repeating-linear-gradient(45deg,var(--cc-hatch) 0 1px,transparent 1px 4px),repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 4px)}
.sx-style-ring .sx-dots{visibility:hidden}
.sx-ring{position:absolute;top:-6px;left:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg);pointer-events:none;overflow:visible}
.sx-arc{fill:none;stroke-width:3;stroke-linecap:round}
.sx-arc--graded,.sx-arc--gradedsoon,.sx-arc--todo{stroke:var(--cc-accent)}
.sx-arc--late{stroke:var(--cc-danger);opacity:.55}
.sx-arc--event{stroke:var(--cc-muted)}
.sx-arc--done{stroke:var(--cc-line-2)}
.sx-barbox{height:46px;display:flex;align-items:flex-end;justify-content:center;width:100%}
.sx-bar{width:62%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--cc-line)}
.sx-bar.h1{background:var(--cc-h1)}.sx-bar.h2{background:var(--cc-h2)}.sx-bar.h3{background:var(--cc-h3)}.sx-bar.h4{background:var(--cc-h4)}
.sx-bar.late{background:var(--cc-danger)}

/* Marks (as Slim.dc.html) */
.mk{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.mk--todo{background:var(--cc-accent)}
.mk--graded{background:var(--cc-accent);border-radius:1.5px;width:7px;height:7px}
.mk--urgent{background:var(--cc-accent);border-radius:1.5px;width:7px;height:7px;box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3px var(--cc-accent)}
.mk--late{border:1.5px solid var(--cc-danger);border-radius:1px;transform:rotate(45deg)}
.mk--event{width:7px;height:7px;border:1.5px solid var(--cc-text-2)}
.mk--done{background:var(--cc-muted);opacity:.4;width:5px;height:5px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--cc-line-2);flex:none}
.sw--hol{background:repeating-linear-gradient(45deg,var(--cc-hatch) 0 1px,transparent 1px 3px),repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 3px)}
.sw--off{background:repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 3px)}

/* Edge fades: only on a side that can still scroll; they take no pointer */
.sx-fade{position:absolute;top:0;z-index:2;pointer-events:none}
.sx-fade--start{left:0;background:linear-gradient(90deg,var(--cc-surface) 0,var(--cc-surface) 62%,transparent)}
.sx-fade--end{right:0;background:linear-gradient(270deg,var(--cc-surface) 0,var(--cc-surface) 62%,transparent)}
.sx-narrow .sx-fade--start{background:linear-gradient(90deg,var(--cc-surface),transparent)}
.sx-narrow .sx-fade--end{background:linear-gradient(270deg,var(--cc-surface),transparent)}

/* The floating arrows, at the row's two ends, centred on the discs */
.sx-arrow{position:absolute;z-index:3;width:30px;height:30px;border-radius:50%;border:1px solid var(--cc-control);background:var(--cc-surface);box-shadow:0 2px 8px -2px rgba(16,24,40,.28);display:grid;place-items:center;color:var(--cc-text);cursor:pointer;padding:0;transition:opacity 120ms,box-shadow 120ms}
.sx-arrow:hover{background:var(--cc-surface-2)}
.sx-arrow--prev{left:2px}
.sx-arrow--next{right:2px}
.sx-arrow[aria-disabled="true"]{opacity:.65;box-shadow:none;cursor:default;background:var(--cc-surface)}

/* The window map, a scrubber: press to jump, drag the thumb; the snap lands at release */
.sx-mapbox{position:relative;height:24px;margin-top:2px;display:flex;align-items:center;cursor:pointer;touch-action:pan-y;user-select:none}
.sx-mapbox .sx-map{flex:1 1 auto;margin-top:0}
.sx-mapbox:hover .sx-thumb,.sx-mapbox--drag .sx-thumb{top:-3px;height:8px;background:color-mix(in oklab,var(--cc-text) 40%,transparent)}
.sx-mapbox .sx-thumb{cursor:grab}
.sx-mapbox--drag,.sx-mapbox--drag .sx-thumb{cursor:grabbing}
.sx-mapbox--drag .sx-thumb{transition:none}
.sx-litick{position:absolute;top:6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--cc-accent)}
.sx-scroller.sx-nosnap{scroll-snap-type:none}
/* The demonstration of which days answer the pointer */
.sx-zone{position:absolute;top:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--cc-danger) 18%,transparent) 0 2px,transparent 2px 7px);border-inline:1px dashed var(--cc-danger)}
.sx-zone span{position:absolute;bottom:-18px;font-size:11px;font-weight:600;color:var(--cc-danger);white-space:nowrap}
.sx-zone--start span{left:0}.sx-zone--end span{right:0}
.sx-col--partial .sx-hit{outline:1px dashed var(--cc-danger);outline-offset:1px}
/* The window map: the whole window, the days in view, today and the needle */
.sx-map{position:relative;height:2px;border-radius:2px;background:var(--cc-line);margin-top:12px}
.sx-thumb{position:absolute;top:-2px;height:6px;border-radius:6px;background:color-mix(in oklab,var(--cc-text) 26%,transparent);transition:left 120ms}
.sx-tick{position:absolute;top:-5px;width:2px;height:12px;margin-left:-1px;border-radius:2px;background:var(--cc-text)}
.sx-tickneedle{position:absolute;top:-14px;width:9px;height:7px;margin-left:-4.5px;background:var(--cc-accent);clip-path:polygon(0 0,100% 0,50% 100%)}
.sx-maplabels{position:relative;height:16px;font-size:11.5px;color:var(--cc-muted);margin-top:6px}
.sx-maplabels span{position:absolute;top:0;left:0;white-space:nowrap}
.sx-maplabels .sx-ml-today{transform:translateX(-50%)}
.sx-maplabels .sx-ml-end{left:auto;right:0}

/* As built: the 21-day grid and the track */
.sx-grid21{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));column-gap:6px;padding-top:12px;align-items:start}
.sx-grid21 .sx-col{scroll-snap-align:none}
.sx-grid21 .sx-dots{justify-content:center;width:100%}
.sx-more--old{margin-left:-7px}
.sx-grid21 .sx-day{width:100%;max-width:44px;aspect-ratio:1/1}
.sx-oldfade{position:absolute;top:0;bottom:20px;width:56px;z-index:2;pointer-events:none}
.sx-oldfade--start{left:0;background:linear-gradient(90deg,var(--cc-surface) 8%,transparent)}
.sx-oldfade--end{right:0;background:linear-gradient(270deg,var(--cc-surface) 8%,transparent)}
.sx-track{position:relative;height:2px;margin-top:16px;border-radius:2px;background:var(--cc-line)}
.sx-trackmark{position:absolute;top:-1px;height:4px;display:flex;justify-content:center}
.sx-trackmark::after{content:"";width:62%;height:4px;border-radius:4px;background:var(--cc-text)}

/* The day's card: a sibling of the scroller, never inside it */
.sx-card{position:absolute;z-index:8;border:1px solid var(--cc-line);border-radius:17px;background:color-mix(in srgb,var(--cc-surface) 94%,transparent);backdrop-filter:blur(22px) saturate(170%);box-shadow:var(--cc-shadow);padding:14px 16px 10px;font-size:14px;text-align:left}
.sx-card--pinned{border-color:color-mix(in oklab,var(--cc-accent) 45%,var(--cc-line))}
.sx-caret{position:absolute;top:-7px;width:13px;height:13px;border-top:1px solid var(--cc-line);border-left:1px solid var(--cc-line);background:var(--cc-surface);transform:rotate(45deg)}
.sx-cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sx-cardtitle{margin:0;font-size:16px;font-weight:600}
.sx-cardsub{margin:4px 0 0;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--cc-muted)}
.sx-chip{display:inline-flex;align-items:center;padding:1px 9px;border-radius:20px;background:var(--cc-surface-2);border:1px solid var(--cc-line);font-weight:600;color:var(--cc-text-2)}
.sx-x{width:34px;height:34px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--cc-muted);cursor:pointer;margin:-4px -6px 0 0}
.sx-items{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.sx-items li{display:flex;gap:11px;align-items:center;padding:8px 0;border-top:1px solid var(--cc-line)}
.sx-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--p);background:color-mix(in oklab,var(--p) 13%,var(--cc-surface))}
.sx-ico--assess{--p:var(--activityassessment)}.sx-ico--todo{--p:var(--activitycontent)}.sx-ico--event{--p:var(--cc-text-2)}.sx-ico--late{--p:var(--cc-danger)}
.sx-itext{min-width:0;flex:1 1 auto}
.sx-imeta{font-size:12px;color:var(--cc-muted)}
.sx-ititle{display:block;text-decoration:none;font-weight:600;font-size:13.5px;color:var(--cc-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx-badge{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--cc-surface-2);border:1px solid var(--cc-line);color:var(--cc-text-2)}
.sx-badge--acc{background:var(--cc-accent);border-color:var(--cc-accent);color:var(--cc-on-accent)}
.sx-badge--danger{border-color:var(--cc-danger);color:var(--cc-danger);background:transparent}
.sx-act{font-size:12.5px;font-weight:600;border-radius:9px;padding:7px 10px;white-space:nowrap;text-decoration:none;flex:none}
.sx-act--primary{background:var(--cc-accent);color:var(--cc-on-accent)!important}
.sx-act--ghost{border:1px solid var(--cc-line-2);color:var(--cc-text-2)!important}
.sx-cardfoot{margin:6px 0 0;padding-top:8px;border-top:1px solid var(--cc-line);display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--cc-muted)}

/* Outline */

  border-radius:12px;padding:10px 12px;font:13px system-ui,sans-serif;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:6px;min-width:190px}

.dcx-tweaks a{color:#0f6cbf}
</style>
</head>
<body>
<div id="dcx-root"></div>
<script type="module">
import { h, render, Component as PreactComponent } from 'https://cdn.jsdelivr.net/npm/preact@10.24.3/dist/preact.module.js';
import htm from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js';
const html = htm.bind(h);
class DCLogic extends PreactComponent {}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sx: {}, ui: {} };
    this.geo = {};
    this.ui0 = {};
    this.pending = {};
    this.raf = 0;
    this.prog = {};
    this.drag = null;
  }

  componentDidMount() {
    this.place(null);
  }

  componentDidUpdate(prev) {
    if (prev.liveWidth !== this.props.liveWidth || prev.stripStyle !== this.props.stripStyle) {
      this.place('live');
    }
  }

  // Puts each scroller at its starting position before the first look (no smooth scroll on the first paint).
  place(only) {
    // Synchronously (the DOM is there after mount), not on a frame: a hidden tab runs no frames.
    setTimeout(() => {
      document.querySelectorAll('.sx-scroller[data-frame]').forEach((el) => {
        if (only && el.dataset.frame !== only) {
          return;
        }
        this.prog[el.dataset.frame] = Date.now();
        el.scrollLeft = Number(el.dataset.init) || 0;
      });
      if (only) {
        this.setState((st) => {
          const sx = Object.assign({}, st.sx);
          const ui = Object.assign({}, st.ui);
          delete sx[only];
          delete ui[only];
          return { sx: sx, ui: ui };
        });
      }
    }, 0);
  }

  data() {
    if (this._d) {
      return this._d;
    }
    const MS = 86400000;
    const START = Date.UTC(2026, 9, 4);
    const N = 58;
    const TODAY = 10;
    const OFF = { 8: 'Holiday (Our Lady of Aparecida)', 19: 'Recess (Academic week)', 29: 'Holiday (All Souls’ Day)', 47: 'Holiday (Black Awareness Day)' };
    const FIX = {
      0: [], 1: [], 2: [], 3: ['event'], 4: ['event'], 5: ['late', 'event'], 6: ['event'], 7: ['event', 'event'],
      8: ['late', 'event', 'event'], 9: ['late', 'late', 'event', 'event'], 10: ['gradedsoon', 'late', 'todo', 'event', 'done'],
      11: ['gradedsoon', 'gradedsoon', 'todo', 'event', 'event'], 12: ['graded', 'graded', 'event', 'event'], 13: ['graded'],
      14: ['graded', 'todo'], 15: ['todo'], 16: ['graded', 'graded'], 17: ['graded', 'event', 'event'], 18: ['graded', 'event'],
      19: [], 20: []
    };
    const ORDER = ['gradedsoon', 'graded', 'todo', 'late', 'event', 'done'];
    const W = { gradedsoon: 3, graded: 3, todo: 2, late: 2, event: 1, done: 0 };
    let seed = 11;
    const rnd = () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
    const days = [];
    for (let i = 0; i < N; i++) {
      const t = new Date(START + i * MS);
      const wd = t.getUTCDay();
      const weekend = wd === 0 || wd === 6;
      let kinds;
      if (FIX[i]) {
        kinds = FIX[i];
      } else if (OFF[i]) {
        kinds = [];
      } else if (weekend) {
        kinds = rnd() < 0.7 ? [] : ['event'];
      } else {
        const k = Math.floor(rnd() * 4);
        kinds = [];
        let graded = 0;
        for (let j = 0; j < k; j++) {
          const r = rnd();
          if (r < 0.35 && graded < 2) {
            kinds.push('graded');
            graded++;
          } else {
            kinds.push(r < 0.7 ? 'todo' : 'event');
          }
        }
        kinds.sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
      }
      const score = kinds.reduce((s, k) => s + W[k], 0);
      const level = score === 0 ? 0 : score <= 2 ? 1 : score <= 5 ? 2 : score <= 8 ? 3 : 4;
      days.push({ i: i, dd: t.getUTCDate(), wd: wd, mo: t.getUTCMonth(), weekend: weekend, hol: OFF[i] || '', kinds: kinds, score: score, level: level });
    }
    let needle = TODAY;
    for (let i = TODAY; i < N; i++) {
      if (days[i].score > days[needle].score) {
        needle = i;
      }
    }
    // The days holding an ANAT101 item, as the card lists them (itemsOf()): what pointing at its tier 1 card lights.
    const lit = days.filter((d) => d.kinds.slice(0, 4).some((k, j) => (d.i + j) % 5 === 0)).map((d) => d.i);
    this._d = { N: N, TODAY: TODAY, days: days, needle: needle, lit: lit };
    return this._d;
  }

  names() {
    return {
      WD: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      WDL: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
      MON: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
    };
  }

  // A day's sentence, as the language file words it (decision 9; amendment 10 for the days off).
  sentence(d, needle) {
    const L = this.names();
    const c = {};
    d.kinds.forEach((k) => {
      const key = k === 'gradedsoon' ? 'graded' : k;
      c[key] = (c[key] || 0) + 1;
    });
    // In the marks' priority, so the kinds a +N hides are named in the same order after the shown ones.
    const parts = [];
    if (c.graded) {
      parts.push(c.graded + ' graded');
    }
    if (c.late) {
      parts.push(c.late + ' late, still open');
    }
    if (c.todo) {
      parts.push(c.todo + ' to do');
    }
    if (c.event) {
      parts.push(c.event + (c.event === 1 ? ' event' : ' events'));
    }
    if (c.done) {
      parts.push(c.done + ' done');
    }
    let s = L.WDL[d.wd] + ', ' + d.dd + ' ' + L.MON[d.mo];
    if (d.hol) {
      s += ', ' + d.hol;
    } else if (d.weekend) {
      s += ', weekend';
    }
    s += ': ' + (parts.length ? parts.join(', ') : 'nothing open');
    if (d.i === needle) {
      s += '. Most relevant day ahead';
    }
    return s;
  }

  dayClass(d, D, extra) {
    const empty = d.kinds.length === 0;
    let cls = 'sx-day';
    if (d.i === D.TODAY) {
      cls += ' today' + (d.level >= 2 ? ' halo' + Math.min(4, d.level) : '');
    } else if (empty && d.hol) {
      cls += ' hol';
    } else if (empty && d.weekend) {
      cls += ' off';
    } else {
      cls += ' h' + d.level;
    }
    if (d.i < D.TODAY) {
      cls += ' past';
    }
    if (d.i !== D.TODAY && d.kinds.indexOf('gradedsoon') >= 0) {
      cls += ' soon';
    }
    return cls + (extra || '');
  }

  wdClass(d, D) {
    const empty = d.kinds.length === 0;
    let cls = 'sx-wd';
    if (d.i === D.TODAY) {
      cls += ' sx-wd--today';
    } else if (!empty && d.hol) {
      cls += ' sx-wd--hol';
    } else if (!empty && d.weekend) {
      cls += ' sx-wd--off';
    }
    return cls;
  }

  // Proposed: one mark per kind present, never repeated, by priority Graded > Late, still open > To do >
  // Event > Done (teaching: grading > class deadline > event). Four slots: all kinds when they fit,
  // else the first three and +N, N = the further kinds hidden (each is named, with its count, in the
  // day's sentence and card).
  kindMarks(d) {
    const PRIORITY = ['graded', 'late', 'todo', 'event', 'done'];
    const present = PRIORITY.filter((k) => d.kinds.some((x) => (x === 'gradedsoon' ? 'graded' : x) === k));
    const soon = d.kinds.indexOf('gradedsoon') >= 0;
    const mark = (k) => 'mk mk--' + (k === 'graded' && soon ? 'urgent' : k);
    if (present.length <= 4) {
      return { dots: present.map(mark), more: '' };
    }
    return { dots: present.slice(0, 3).map(mark), more: '+' + (present.length - 3) };
  }

  // As built: one mark per item, at most `max` (DOTS_MAX), then +N items.
  dotsOf(d, max) {
    return d.kinds.slice(0, max).map((k) => 'mk mk--' + (k === 'gradedsoon' ? 'urgent' : k));
  }

  moreOf(d, max) {
    return d.kinds.length > max ? '+' + (d.kinds.length - max) : '';
  }

  arcsOf(d) {
    const C = 2 * Math.PI * 27;
    const list = d.kinds.slice(0, 6);
    const count = list.length;
    const gap = count > 1 ? 6 : 0;
    return list.map((k, at) => ({
      cls: 'sx-arc sx-arc--' + k,
      dash: (C / count - gap).toFixed(2) + ' ' + C.toFixed(2),
      off: (-(at * C) / count - gap / 2).toFixed(2)
    }));
  }

  itemsOf(d) {
    const CODES = ['ANAT101', 'PHAR210', 'DS201', 'EE110', 'OC202'];
    const TIMES = ['8:00 AM', '10:00 AM', '12:00 PM', '2:00 PM', '5:00 PM', '6:00 PM', '11:59 PM'];
    const QUIZ = 'M7.5 4h9A3.5 3.5 0 0 1 20 7.5v9a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 16.5v-9A3.5 3.5 0 0 1 7.5 4zM8.5 12.5l2.5 2.5 4.5-5';
    const FILE = 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4';
    const CAP = 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5';
    const GRADED = ['Quiz 3: Respiratory system', 'Dosage calculations', 'Project milestone 2', 'Lab report 4'];
    return d.kinds.slice(0, 4).map((k, j) => {
      const base = { time: TIMES[(d.i * 3 + j) % 7], code: CODES[(d.i + j) % 5] };
      if (k === 'graded' || k === 'gradedsoon') {
        return Object.assign(base, { ico: 'sx-ico sx-ico--assess', path: QUIZ, title: GRADED[(d.i + j) % 4], badge: k === 'gradedsoon' ? 'Graded, due soon' : 'Graded', badgeCls: 'sx-badge sx-badge--acc', action: 'Attempt quiz now', actCls: 'sx-act sx-act--primary' });
      }
      if (k === 'todo') {
        return Object.assign(base, { ico: 'sx-ico sx-ico--todo', path: FILE, title: 'Reading log: week ' + (1 + d.i % 9), badge: 'To do', badgeCls: 'sx-badge', action: 'Add submission', actCls: 'sx-act sx-act--primary' });
      }
      if (k === 'late') {
        return Object.assign(base, { ico: 'sx-ico sx-ico--late', path: FILE, title: 'Essay draft', badge: 'Late, still open', badgeCls: 'sx-badge sx-badge--danger', action: 'Add submission', actCls: 'sx-act sx-act--primary' });
      }
      if (k === 'done') {
        return Object.assign(base, { ico: 'sx-ico sx-ico--event', path: QUIZ, title: 'Lab safety quiz', badge: 'Done', badgeCls: 'sx-badge', action: 'View', actCls: 'sx-act sx-act--ghost' });
      }
      return Object.assign(base, { ico: 'sx-ico sx-ico--event', path: CAP, title: 'Anatomy lab briefing', badge: 'Event', badgeCls: 'sx-badge', action: 'View', actCls: 'sx-act sx-act--ghost' });
    });
  }

  uiOf(id, st) {
    const s = st || this.state;
    return Object.assign({ hover: null, pinned: null, focus: null, ring: null, drag: false }, this.ui0[id] || {}, s.ui[id] || {});
  }

  setUi(id, patch) {
    this.setState((st) => {
      const ui = Object.assign({}, st.ui);
      ui[id] = Object.assign({}, this.uiOf(id, st), patch);
      return { ui: ui };
    });
  }

  scroller(id) {
    return document.querySelector('.sx-scroller[data-frame="' + id + '"]');
  }

  scrollOf(id) {
    const el = this.scroller(id);
    return el ? Math.abs(el.scrollLeft) : 0;
  }

  behavior() {
    const reduce = this.props.reducedMotion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    return reduce ? 'auto' : 'smooth';
  }

  // Wholly in view: the day's column inside the scroller's box minus the inset the arrows sit over.
  fullyAt(g, i, s) {
    const x0 = g.inset + i * g.p - s;
    return x0 >= g.inset - 0.5 && x0 + g.col <= g.W - g.inset + 0.5;
  }

  fully(id, i) {
    const g = this.geo[id];
    return !!g && this.fullyAt(g, i, this.scrollOf(id));
  }

  // Scrolls the strip only, never the page, to put day `index` first wholly in view.
  goTo(id, index) {
    const g = this.geo[id];
    const el = this.scroller(id);
    if (!g || !el) {
      return;
    }
    const left = Math.max(0, Math.min(g.maxS, index * g.p));
    this.prog[id] = Date.now();
    el.scrollTo({ left: left, behavior: this.behavior() });
  }

  page(id, dir) {
    const g = this.geo[id];
    if (!g) {
      return;
    }
    const s = this.scrollOf(id);
    if ((dir < 0 && s <= 2) || (dir > 0 && s >= g.maxS - 2)) {
      return;
    }
    this.setUi(id, { hover: null, pinned: null });
    this.goTo(id, Math.round(s / g.p) + dir * g.step);
  }

  today(id) {
    const g = this.geo[id];
    if (!g || Math.abs(this.scrollOf(id) - g.homeS) <= 2) {
      return;
    }
    this.setUi(id, { hover: null, pinned: null });
    this.goTo(id, g.home);
  }

  // Shows day i wholly in view, scrolling the least.
  reveal(id, i) {
    const g = this.geo[id];
    if (!g) {
      return;
    }
    const s = this.scrollOf(id);
    if (this.fullyAt(g, i, s)) {
      return;
    }
    const x0 = g.inset + i * g.p - s;
    this.goTo(id, x0 < g.inset ? i : i - g.nFull + 1);
  }

  keyDay(id, i, e) {
    const g = this.geo[id];
    let t = null;
    if (e.key === 'ArrowRight') {
      t = i + 1;
    } else if (e.key === 'ArrowLeft') {
      t = i - 1;
    } else if (e.key === 'Home') {
      t = 0;
    } else if (e.key === 'End') {
      t = g.N - 1;
    } else if (e.key === 'PageDown') {
      t = i + g.step;
    } else if (e.key === 'PageUp') {
      t = i - g.step;
    } else {
      return;
    }
    e.preventDefault();
    t = Math.max(0, Math.min(g.N - 1, t));
    const el = this.scroller(id);
    const btn = el && el.querySelector('[data-idx="' + t + '"]');
    if (!btn) {
      return;
    }
    // The browser's own focus scroll would jump (and scroll the page); the strip scrolls itself.
    btn.focus({ preventScroll: true });
    this.reveal(id, t);
  }

  focusDay(id, i) {
    const u = this.uiOf(id);
    this.setUi(id, { focus: i, ring: null, hover: u.pinned === null ? i : u.hover });
    this.reveal(id, i);
  }

  // The pointer opens only a day wholly in view; a day under an arrow or cut by an edge stays shut.
  enter(id, i) {
    const u = this.uiOf(id);
    if (u.pinned !== null || this.drag) {
      return;
    }
    if (!this.fully(id, i)) {
      if (u.hover !== null) {
        this.setUi(id, { hover: null });
      }
      return;
    }
    if (u.hover !== i) {
      this.setUi(id, { hover: i });
    }
  }

  leave(id) {
    const u = this.uiOf(id);
    if (u.pinned === null && u.hover !== null) {
      this.setUi(id, { hover: null });
    }
  }

  // A press on a partly hidden day scrolls it into view first, then pins it.
  press(id, i) {
    const u = this.uiOf(id);
    if (u.pinned === i) {
      this.setUi(id, { pinned: null, hover: null });
      return;
    }
    this.reveal(id, i);
    this.setUi(id, { pinned: i, hover: i });
  }

  keyBox(id, e) {
    if (e.key !== 'Escape') {
      return;
    }
    const u = this.uiOf(id);
    const back = u.pinned !== null ? u.pinned : u.hover;
    this.setUi(id, { pinned: null, hover: null });
    const el = this.scroller(id);
    const btn = el && back !== null ? el.querySelector('[data-idx="' + back + '"]') : null;
    if (btn) {
      btn.focus({ preventScroll: true });
    }
  }

  // A user's scroll closes a hovered card, and a pinned one once its day is no longer wholly in view.
  // Scrolls the strip makes itself (arrows, Today, keyboard, a press) close nothing.
  onScroll(id, e) {
    this.pending[id] = Math.abs(e.currentTarget.scrollLeft);
    if (this.raf) {
      return;
    }
    // A short timer rather than a frame, so the mockup also follows in a background tab.
    this.raf = setTimeout(() => {
      this.raf = 0;
      const pend = this.pending;
      this.pending = {};
      this.setState((st) => {
        const sx = Object.assign({}, st.sx, pend);
        const ui = Object.assign({}, st.ui);
        Object.keys(pend).forEach((k) => {
          const u = this.uiOf(k, st);
          const g = this.geo[k];
          const own = Date.now() - (this.prog[k] || 0) < 900;
          if (own || !g) {
            return;
          }
          if (u.pinned === null && u.hover !== null) {
            ui[k] = Object.assign({}, u, { hover: null });
          } else if (u.pinned !== null && !this.fullyAt(g, u.pinned, pend[k])) {
            ui[k] = Object.assign({}, u, { hover: null, pinned: null });
          }
        });
        return { sx: sx, ui: ui };
      });
    }, 16);
  }

  // The map as a scrubber: press on the line to jump there, drag the thumb, snap at release.
  scrubTo(fx) {
    const d = this.drag;
    const g = this.geo[d.id];
    const t = Math.max(0, Math.min(1 - d.tw, fx - d.grab));
    d.el.scrollLeft = Math.max(0, Math.min(g.maxS, t * g.N * g.p));
  }

  mapDown(id, e) {
    const g = this.geo[id];
    const el = this.scroller(id);
    if (!g || !el || (e.pointerType === 'mouse' && e.button !== 0)) {
      return;
    }
    const box = e.currentTarget;
    const r = box.getBoundingClientRect();
    const fx = (e.clientX - r.left) / r.width;
    const tl = this.scrollOf(id) / g.p / g.N;
    const tw = g.span / g.N;
    const onThumb = fx >= tl - 0.01 && fx <= tl + tw + 0.01;
    this.drag = { id: id, el: el, tw: tw, grab: onThumb ? fx - tl : tw / 2 };
    try {
      box.setPointerCapture(e.pointerId);
    } catch (err) {
      // A synthetic pointer has no capture; the drag still follows moves over the map.
    }
    el.classList.add('sx-nosnap');
    if (!onThumb) {
      this.scrubTo(fx);
    }
    this.setUi(id, { drag: true, hover: null, pinned: null });
    e.preventDefault();
  }

  mapMove(id, e) {
    if (!this.drag || this.drag.id !== id) {
      return;
    }
    const r = e.currentTarget.getBoundingClientRect();
    this.scrubTo((e.clientX - r.left) / r.width);
  }

  mapUp(id) {
    if (!this.drag || this.drag.id !== id) {
      return;
    }
    const g = this.geo[id];
    const el = this.drag.el;
    this.drag = null;
    el.classList.remove('sx-nosnap');
    this.goTo(id, Math.round(Math.abs(el.scrollLeft) / g.p));
    this.setUi(id, { drag: false });
  }

  // A narrow block shortens the months of a span, so Today keeps its line.
  monthLabel(a, b, short) {
    const L = this.names();
    if (a.mo === b.mo) {
      return L.MON[a.mo] + ' 2026';
    }
    const nm = (m) => (short ? L.MON[m].slice(0, 3) : L.MON[m]);
    return nm(a.mo) + ' – ' + nm(b.mo) + ' 2026';
  }

  chipOf(rel) {
    if (rel === 0) {
      return 'Today';
    }
    if (rel === 1) {
      return 'Tomorrow';
    }
    if (rel === -1) {
      return 'Yesterday';
    }
    return rel > 1 ? 'In ' + rel + ' days' : -rel + ' days ago';
  }

  // The row's geometry: a day every p px; the arrows sit over `inset` px at each end; the scroller's
  // padding and scroll-padding equal the inset, so a snapped row starts its first whole day just
  // past the start arrow, and at either end of the window the end day sits clear of the arrow.
  geometry(c) {
    const D = this.data();
    const style = c.style || 'dots';
    const narrow = !!c.narrow;
    const ring = style === 'ring';
    const N = D.N;
    const inset = narrow ? 4 : 32;
    const gap = ring ? 12 : 6;
    let p = ring ? 60 : 50;
    if (narrow) {
      // The phone's half-day peek: 7 1/2 days (5 1/2 for rings) in the row.
      p = Math.floor((c.W - 2 * inset + gap) / (ring ? 5.5 : 7.5));
    }
    const col = p - gap;
    const disc = style === 'pulse' ? 30 : 36;
    const hit = Math.min(44, col);
    const nFull = Math.max(1, Math.floor((c.W - 2 * inset + gap) / p));
    const content = 2 * inset + N * p - gap;
    const scrolls = content > c.W + 1;
    const maxS = Math.max(0, content - c.W);
    const past = narrow ? Math.floor((nFull - 1) / 2) : 5;
    const home = Math.max(0, D.TODAY - past);
    const homeS = Math.min(maxS, home * p);
    const step = narrow ? 7 : Math.max(7, 7 * Math.floor(nFull / 7));
    return { W: c.W, N: N, inset: inset, gap: gap, p: p, col: col, disc: disc, hit: hit, nFull: nFull, scrolls: scrolls, maxS: maxS, home: home, homeS: homeS, step: step, span: (c.W - 2 * inset) / p, narrow: narrow, ring: ring, pulse: style === 'pulse', style: style };
  }

  // One strip, scrolled. c: id, W (the strip's width), style, narrow, first, ui0, title, notes...
  frame(c) {
    const D = this.data();
    const L = this.names();
    if (c.ui0) {
      this.ui0[c.id] = c.ui0;
    }
    const u = this.uiOf(c.id);
    const g = this.geometry(c);
    this.geo[c.id] = g;
    const id = c.id;
    const N = g.N;
    const initS = c.first === undefined ? g.homeS : Math.max(0, Math.min(g.maxS, c.first * g.p));
    const s = this.state.sx[id] !== undefined ? this.state.sx[id] : initS;
    const first = Math.max(0, Math.min(N - 1, Math.round(s / g.p)));
    const last = Math.min(N - 1, first + g.nFull - 1);
    const atStart = s <= 2;
    const atEnd = s >= g.maxS - 2;
    const atHome = Math.abs(s - g.homeS) <= 2;
    const barTop = g.pulse ? 52 : 0;
    const discTop = 12 + barTop;
    const rowH = discTop + 44 + 6 + 9 + 6 + 16 + (g.narrow ? 8 : 6);
    const openIdx = u.pinned !== null ? u.pinned : u.hover;
    const tabIdx = u.focus !== null ? u.focus : (D.TODAY >= first && D.TODAY <= last ? D.TODAY : first);
    const days = D.days.map((d) => {
      let extra = '';
      if (openIdx === d.i) {
        extra += u.pinned === d.i ? ' pinned' : ' open';
      }
      const x0 = g.inset + d.i * g.p - s;
      const partial = x0 + g.col > 0 && x0 < g.W && !this.fullyAt(g, d.i, s);
      let colCls = 'sx-col';
      if (c.lit && c.lit.indexOf(d.i) < 0) {
        colCls += ' sx-col--dim';
      }
      if (c.zones && partial) {
        colCls += ' sx-col--partial';
      }
      return {
        i: d.i,
        n: d.dd,
        wd: L.WD[d.wd],
        wdCls: this.wdClass(d, D),
        colCls: colCls,
        hitCls: 'sx-hit' + (u.ring === d.i ? ' kfocus' : ''),
        partial: partial,
        cls: this.dayClass(d, D, extra),
        label: this.sentence(d, D.needle),
        dots: this.kindMarks(d).dots,
        more: this.kindMarks(d).more,
        needle: d.i === D.needle,
        tab: d.i === tabIdx ? 0 : -1,
        expanded: openIdx === d.i,
        arcs: g.ring ? this.arcsOf(d) : [],
        barCls: 'sx-bar h' + d.level + (d.kinds.indexOf('late') >= 0 ? ' late' : ''),
        barH: d.kinds.length ? 10 + Math.min(d.kinds.length, 5) * 7 : 4,
        enter: () => this.enter(id, d.i),
        focus: () => this.focusDay(id, d.i),
        click: () => this.press(id, d.i),
        key: (e) => this.keyDay(id, d.i, e)
      };
    });
    let card = null;
    if (openIdx !== null && !g.narrow) {
      const d = D.days[openIdx];
      const center = g.inset + openIdx * g.p + g.col / 2 - s;
      const w = Math.min(400, c.W);
      const left = Math.max(0, Math.min(c.W - w, center - w / 2));
      const items = this.itemsOf(d);
      card = {
        cls: 'sx-card' + (u.pinned !== null ? ' sx-card--pinned' : ''),
        title: L.WDL[d.wd] + ', ' + d.dd + ' ' + L.MON[d.mo],
        chip: this.chipOf(openIdx - D.TODAY),
        count: items.length ? (d.kinds.length + (d.kinds.length === 1 ? ' item' : ' items')) : 'Nothing open',
        left: Math.round(left),
        top: rowH + 6,
        w: w,
        caret: true,
        caretX: Math.round(center - left - 6.5),
        out: false,
        pinned: u.pinned !== null,
        close: () => this.setUi(id, { pinned: null, hover: null }),
        items: items,
        foot: u.pinned !== null ? 'Pinned. Escape or the close button lets it go.' : 'Click the day to pin this card.'
      };
    }
    const fadeW = g.narrow ? 18 : g.inset + 16;
    const arrows = !g.narrow && g.scrolls;
    const map = !g.narrow && g.scrolls && c.map !== false;
    const frameVals = {
      id: id,
      after: true,
      before: false,
      wide: !g.narrow,
      narrow: g.narrow,
      ring: g.ring,
      pulse: g.pulse,
      month: this.monthLabel(D.days[first], D.days[last], g.narrow),
      atHome: atHome,
      atStart: atStart,
      atEnd: atEnd,
      arrows: arrows,
      fadeStart: g.scrolls && !atStart,
      fadeEnd: g.scrolls && !atEnd,
      fadeStyle: 'width: ' + fadeW + 'px; height: ' + rowH + 'px',
      arrowTop: Math.round(discTop + 22 - 15),
      zones: !!c.zones,
      zoneStartStyle: 'left: 0; width: ' + g.inset + 'px; height: ' + rowH + 'px',
      zoneEndStyle: 'right: 0; width: ' + g.inset + 'px; height: ' + rowH + 'px',
      listLabel: 'Days from 4 October to 30 November',
      initS: initS,
      scrollerStyle: 'padding-inline: ' + g.inset + 'px; scroll-padding-inline: ' + g.inset + 'px; grid-auto-columns: ' + g.col + 'px; column-gap: ' + g.gap + 'px' + (g.narrow ? '' : '; scrollbar-width: none'),
      hitStyle: 'width: ' + g.hit + 'px; height: 44px',
      discStyle: 'width: ' + g.disc + 'px; height: ' + g.disc + 'px; font-size: ' + (g.disc < 34 ? 13 : 15) + 'px',
      days: days,
      card: card,
      map: map,
      mapCls: 'sx-mapbox' + (u.drag ? ' sx-mapbox--drag' : ''),
      mapLabels: !!c.mapLabels,
      mapStyle: 'margin: 0 ' + g.inset + 'px',
      thumbLeft: ((s / g.p) / N * 100).toFixed(2),
      thumbW: (Math.min(N, g.span) / N * 100).toFixed(2),
      todayTick: ((D.TODAY + 0.5) / N * 100).toFixed(2),
      needleTick: ((D.needle + 0.5) / N * 100).toFixed(2),
      litTicks: c.lit ? c.lit.map((i) => ((i + 0.5) / N * 100).toFixed(2)) : [],
      legend: !!c.legend,
      pins: !!c.pins,
      pinList: c.pins ? this.pinsOf(c, g, first, discTop, rowH) : [],
      onScroll: (e) => this.onScroll(id, e),
      prev: () => this.page(id, -1),
      next: () => this.page(id, 1),
      goToday: () => this.today(id),
      leave: () => this.leave(id),
      keyBox: (e) => this.keyBox(id, e),
      mapDown: (e) => this.mapDown(id, e),
      mapMove: (e) => this.mapMove(id, e),
      mapUp: () => this.mapUp(id),
      stripCls: 'sx-strip' + (g.narrow ? ' sx-narrow' : '') + ' sx-style-' + g.style,
      blockW: c.W + 34
    };
    return this.wrap(c, frameVals);
  }

  pinsOf(c, g, first, discTop, rowH) {
    const D = this.data();
    const top = 52;
    const tx = g.inset + (D.TODAY - first) * g.p + g.col / 2;
    const ax = g.inset + (D.TODAY + 3 - first) * g.p + g.col / 2;
    return [
      { n: 1, x: 112, y: -26 },
      { n: 2, x: 372, y: -26 },
      { n: 3, x: -14, y: top + discTop + 22 - 32 },
      { n: 4, x: 22, y: top + rowH - 4 },
      { n: 5, x: tx + 16, y: top + discTop - 8 },
      { n: 6, x: 300, y: top + rowH - 4 },
      { n: 7, x: c.W - 8, y: top + discTop + 22 - 32 },
      { n: 8, x: 190, y: top + rowH + 12 },
      { n: 9, x: ax + 18, y: top + discTop + 46 }
    ];
  }

  wrap(c, v) {
    const phone = !!c.phone;
    return Object.assign(v, {
      figCls: 'sx-fig' + (c.below ? ' sx-fig--below' : '') + (c.notes ? '' : ' sx-fig--solo'),
      tag: c.tag || 'Proposed',
      tagCls: 'tag ' + (c.tagCls || 'tag--rec'),
      title: ' ' + c.title,
      notes: c.notes || [],
      hasNotes: !!c.notes,
      phone: phone,
      shellCls: phone ? 'sx-phone' : '',
      shellStyle: phone ? 'width: 390px' : '',
      blockCls: 'sx-block' + (c.dark ? ' cc-root cc-dark' : ''),
      below: c.below ? 0 : (c.room || 0)
    });
  }

  before(c) {
    const D = this.data();
    const L = this.names();
    const bdays = D.days.slice(0, 21).map((d) => ({
      n: d.dd,
      wd: L.WD[d.wd],
      wdCls: this.wdClass(d, D),
      cls: this.dayClass(d, D, ''),
      label: this.sentence(d, D.needle),
      dots: this.dotsOf(d, 4),
      more: this.moreOf(d, 4),
      needle: d.i === D.needle
    }));
    return this.wrap(c, {
      id: c.id,
      after: false,
      before: true,
      bdays: bdays,
      trackLeft: (D.TODAY / 21 * 100).toFixed(2),
      trackW: (100 / 21).toFixed(2),
      blockW: c.W + 34
    });
  }

  renderVals() {
    const D = this.data();
    const lw = this.props.liveWidth || '784';
    const style = this.props.stripStyle || 'dots';
    const phone = lw === '390';
    const live = this.frame({
      id: 'live',
      W: phone ? 332 : Number(lw),
      narrow: phone,
      phone: phone,
      style: style,
      legend: !phone,
      mapLabels: true,
      title: phone ? 'Phone, 390 px screen' : 'Live, ' + lw + ' px',
      below: !phone && lw === '1034',
      room: phone ? 0 : 330,
      notes: [
        'Scroll with a trackpad, shift and the wheel, a touch screen, the floating arrows, the map under the row, or the keyboard (Tab into the row, then the arrow keys, Page Up and Down, Home and End).',
        'The arrows sit over the row’s ends and step 14 days, so each weekday keeps its column; each is disabled at its end. Today returns to five past days (three on a phone).',
        'Point at a day for its card, click to pin it. A day under an arrow or cut by an edge does not open on hover; a click on it scrolls it into view and then pins it.',
        'The map is a scrubber: press anywhere on it to jump, drag the thumb to move; the row snaps to a whole day when you let go.',
        'A hovered card closes when you scroll; a pinned one closes once its day is no longer wholly in view.',
        'Tweaks: style, width (784 Dashboard, 1034 block page, 390 phone), dark, reduced motion.'
      ]
    });
    const a784 = this.frame({ id: 'a784', W: 784, title: 'Proposed, Dashboard, 784 px', legend: true, mapLabels: true, notes: [

      'The arrows float over the row’s ends; the day partly under one does not answer the pointer (panel 5).'
    ] });
    const b784 = this.before({ id: 'b784', W: 784, tag: 'As built', tagCls: 'tag--old', title: 'Dashboard, 784 px: 21 days, today centred', notes: [
      '21 equal tracks in 784 px: a day every 37.6 px, discs 31.6 px (the screenshot: 36 px and about 30 px at 774 px).',

      'Arrows and Today in the header, moving 7 days (STEP_DAYS, :85); the track marks today’s place in the row (amendment 10).'
    ] });
    const p1034 = this.frame({ id: 'p1034', W: 1034, title: 'Proposed, the block’s page, 1034 px', below: true, legend: true, mapLabels: true, notes: [
      '19 whole days at the same 50 px pitch (as built: 21 at 49.5 px). Home: 5 past, today, 13 ahead, 9 to 27 October. A step is still 14 days, two whole weeks.'
    ] });
    const mid = this.frame({ id: 'mid', W: 784, first: 18, title: 'Scrolled into the turn of the month: both arrows enabled', notes: [

    ] });
    const start = this.frame({ id: 'start', W: 784, first: 0, title: 'At the window’s start: Earlier days disabled', notes: [

      'No start fade. The past’s late work is all here, which is where the closed line’s Late period opens the strip.'
    ] });
    const end = this.frame({ id: 'end', W: 784, first: 57, title: 'At the window’s end: Later days disabled', notes: [
      'The end of next month (decision 3), 30 November clear of the disabled arrow; no end fade. Holidays stay cross-hatched (20 November).'
    ] });
    const zones = this.frame({ id: 'zones', W: 784, first: 18, zones: true, title: 'Which days answer the pointer', notes: [

    ] });

    ] });
    const kb1 = this.frame({ id: 'kb1', W: 784, ui0: { focus: 18, ring: 18 }, title: 'Keyboard 1: focus on the last whole day (22 October)', notes: [

    ] });
    const kb2 = this.frame({ id: 'kb2', W: 784, first: 6, ui0: { focus: 19, ring: 19 }, title: 'Keyboard 2: Right arrow, the row moves one day', notes: [

    const ring = this.frame({ id: 'ring', W: 784, style: 'ring', title: 'Ring style: 12 px clear between rings', notes: [

    ] });
    const scrub = this.frame({ id: 'scrub', W: 784, first: 26, ui0: { drag: true }, mapLabels: true, title: 'The map as a scrubber, mid-drag', notes: [
      'Press on the line: the thumb centres there and the row follows at once. Drag the thumb: the row follows the pointer (mouse, pen or touch). Release: the row snaps to the nearest whole day.',

      'New: the lit days can now be out of view (14 of 58 in sight), so the map shows a dot under each of them. Nothing scrolls on its own; the dots say where to go.',

    ] });
    const phone1 = this.frame({ id: 'ph1', W: 332, narrow: true, phone: true, title: 'Phone, home: 3 past, today, 3 ahead, half a day' });

    const dark = this.frame({ id: 'dark', W: 784, dark: true, ui0: { pinned: 11, hover: 11 }, legend: true, room: 440, title: 'Dark mode, a pinned card on the needle’s day', notes: [
      'Every token as built: the arrows draw the control border, the map and fades paint the surface, marks take the dark-aware ink (--block_compass-brand-ink, amendment 10).'
    ] });

    const panels = [
      { kicker: '1 · Interactive', title: 'Try it', lead: 'The proposed strip as one native scroller. The code sets the starting position, moves the strip for the arrows, Today, the map and the keyboard, and reads the position back for the arrows, fades, month and map.', bodyCls: 'sx-body', frames: [live] },
      { kicker: '2 · Spacing and marks', title: 'Before and after on the Dashboard', lead: 'Smaller discs in the same 44 px targets: the days breathe without losing the phone’s pitch. One mark per kind present under a day, never repeated; four slots.', bodyCls: 'sx-body', frames: [b784, a784], spacing: true },
      { kicker: '3 · The block’s page', title: 'The page at 1034 px', lead: 'The same rule, 19 whole days.', bodyCls: 'sx-body', frames: [p1034] },
      { kicker: '4 · States', title: 'The middle, the start and the end', lead: 'Arrows, fades and Today come from the measured scroll position, with a 2 px tolerance (local_dimensions’ rule). On a block wide enough for the whole window (about 2,950 px) nothing scrolls: no arrows, no fades, no map.', bodyCls: 'sx-body', frames: [mid, start, end] },
      { kicker: '5 · The pointer', title: 'Hover opens only a day wholly in view', lead: 'With the arrows over the row’s ends, a day can sit half under one. Such a day neither opens nor prefetches on hover, and a pinned card closes when its day stops being wholly in view.', bodyCls: 'sx-body', frames: [zones, hover], clip: true },
      { kicker: '6 · The map', title: 'A scrubber, and where a pointed card’s days are', lead: 'The map looked draggable, so now it is: press to jump, drag to move, snap at release.', bodyCls: 'sx-body', frames: [scrub, lit] },
      { kicker: '7 · Keyboard', title: 'Focus scrolls the row into view', lead: 'The arrows and the map are pointer conveniences; the keyboard reaches every day of the window through the row itself.', bodyCls: 'sx-body', frames: [kb1, kb2] },
      { kicker: '8 · Strip styles', title: 'Ring and pulse in the scroller', lead: 'One payload, three styles, as built. The slim closed line (amendment 11) has no row and does not change.', bodyCls: 'sx-body', frames: [ring, pulse] },
      { kicker: '9 · Phone', title: 'Phone, 390 px', lead: 'Below 640 px of the block: seven and a half days, three past, no arrows and no map (touch scrolls; a mouse on a narrow window gets the platform’s thin scrollbar), thin fades, the day’s sheet from the bottom as built.', bodyCls: 'sx-body sx-body--row', frames: [phone1, phone2] },
      { kicker: '10 · Dark', title: 'Dark mode', lead: 'Bootstrap’s colour mode, Moodle 5.2’s one mechanism.', bodyCls: 'sx-body', frames: [dark] },
      { kicker: '11 · Anatomy and accessibility', title: 'Anatomy, markup and keys', lead: 'The row is one tab stop covering the whole window, and screen readers read every day whether it is in view or not.', bodyCls: 'sx-body', frames: [anat], anatomy: true }
    ];
    return {
      rootCls: 'cc-root' + (this.props.dark ? ' cc-dark' : '') + (this.props.reducedMotion ? ' sx-calm' : ''),
      panels: panels
    };
  }
}

Component.prototype.render = function () {
