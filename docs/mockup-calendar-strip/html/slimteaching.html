<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass slim strip, teaching line</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.cc-root{
  --cc-page:#f4f5f7;--cc-surface:#fff;--cc-surface-2:#f6f7f9;--cc-text:#1d2125;--cc-text-2:#454c53;--cc-muted:#68717a;
  --cc-line:#e4e7eb;--cc-line-2:#d5dade;--cc-accent:#0f6cbf;--cc-on-accent:#fff;--cc-danger:#ca3120;--cc-warn:#f0ad4e;
  --cc-ink:#121518;--cc-on-ink:#fff;--cc-control:#6a737b;
  --cc-h1:color-mix(in oklab,var(--cc-warn) 17%,var(--cc-surface));
  --cc-h2:color-mix(in oklab,var(--cc-warn) 36%,var(--cc-surface));
  --cc-h3:color-mix(in oklab,var(--cc-warn) 62%,var(--cc-surface));
  --cc-h4:color-mix(in oklab,var(--cc-warn) 92%,var(--cc-surface));
  font-family:'Noto Sans',system-ui,sans-serif;background:var(--cc-page);color:var(--cc-text);
  font-variant-numeric:tabular-nums;font-size:15px;line-height:1.45;
}
.cc-root.cc-dark,.cc-root .cc-dark{
  --cc-page:#0f1113;--cc-surface:#1a1d20;--cc-surface-2:#22262a;--cc-text:#eceef0;--cc-text-2:#c4c9ce;--cc-muted:#99a1a9;
  --cc-line:#2c3135;--cc-line-2:#3a4045;--cc-danger:#ff7b6b;--cc-warn:#f2b45c;--cc-control:#99a1a9;
  --cc-accent:color-mix(in oklab,#0f6cbf 35%,#eceef0);--cc-on-accent:#0b1a29;
  --cc-h1:color-mix(in oklab,var(--cc-warn) 17%,var(--cc-surface));
  --cc-h2:color-mix(in oklab,var(--cc-warn) 36%,var(--cc-surface));
  --cc-h3:color-mix(in oklab,var(--cc-warn) 80%,var(--cc-surface));
  --cc-h4:color-mix(in oklab,var(--cc-warn) 92%,var(--cc-surface));
  --cc-ink:#f3f4f6;--cc-on-ink:#111417;
  color:var(--cc-text);
}
.cc-root *{box-sizing:border-box}
.cc-root button{font:inherit;color:inherit}
.cc-root :focus-visible{outline:2px solid var(--cc-accent);outline-offset:2px}
.cc-root a{color:var(--cc-accent)}

/* Canvas furniture */
.panel{background:var(--cc-surface);border:1px solid var(--cc-line);border-radius:16px;padding:26px 28px}
.kicker{font-size:12.5px;font-weight:600;color:var(--cc-accent);margin:0 0 4px}
.h{margin:0 0 6px;font-size:21px;font-weight:600;letter-spacing:-.01em}
.p{margin:0;color:var(--cc-text-2);font-size:14px;line-height:1.55}
.p b{color:var(--cc-text)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--cc-surface-2);border:1px solid var(--cc-line);color:var(--cc-text-2);white-space:nowrap}
.tag--rec{background:var(--cc-accent);border-color:var(--cc-accent);color:var(--cc-on-accent)}
.tag--before{border-style:dashed;color:var(--cc-danger)}
.tag--alt{border-style:dashed}
.notes{margin:0;padding-left:18px;font-size:13.5px;color:var(--cc-text-2);line-height:1.55;display:flex;flex-direction:column;gap:6px}
.notes b{color:var(--cc-text);font-weight:600}
.notes code,.p code,td code,.cap code{font-size:12.5px;background:var(--cc-surface-2);border:1px solid var(--cc-line);border-radius:4px;padding:0 4px}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--cc-muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--cc-line);vertical-align:bottom}
table.t td{padding:9px 10px;border-bottom:1px solid var(--cc-line);color:var(--cc-text-2);vertical-align:top}
table.t td b{color:var(--cc-text);font-weight:600}
pre.code{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;background:var(--cc-surface-2);border:1px solid var(--cc-line);border-radius:10px;padding:14px 16px;white-space:pre-wrap;color:var(--cc-text)}
.sec{display:flex;flex-direction:column;gap:16px}
.frames{display:flex;flex-direction:column;gap:22px}
.frames--row{flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:28px}
.fr{display:flex;flex-direction:column;gap:8px;margin:0}
.fr-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.fr-meta b{font-weight:600}
.fr-w{font-size:12px;color:var(--cc-muted)}
.cap{font-size:12.5px;color:var(--cc-muted);margin:0 2px;line-height:1.5;max-width:1030px}
.sr{font-size:12.5px;margin:0 2px;line-height:1.5;max-width:1030px;color:var(--cc-text-2);border-left:3px solid var(--cc-accent);padding:2px 0 2px 10px}
.sr b{color:var(--cc-text);font-weight:600;margin-right:6px}
.meas{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--cc-muted)}

/* The block around the strip: Moodle's card, its body padding outside the measured width */
.blk-c{width:fit-content;background:var(--cc-surface);border:1px solid var(--cc-line);border-radius:14px;padding:14px 16px 4px;color:var(--cc-text)}
.blk-c--tips{padding-top:46px}

/* The strip, closed, in the built block's numbers (styles.css 1024-1900, 1 rem = 16 px). */
.cal{position:relative;padding-bottom:12px;font-variant-numeric:tabular-nums}
.cal-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px 12px}
.cal-title{display:inline-flex;margin:0;font-size:16px}
.cal-toggle{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 4px;border:0;border-radius:9.6px;background:transparent;color:var(--cc-text);font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap}
.cal-toggle:hover{background:var(--cc-surface-2)}
.cal-chev{color:var(--cc-accent);display:inline-flex;width:16px;justify-content:center}
.cal-lead{margin:0;color:var(--cc-text);font-size:13px;font-weight:600}
.cal-line{display:contents}
.cal-periods{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:0;padding:0;list-style:none}
.cal-period{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:104px;min-height:56px;padding:4px 12px 5px 10px;border:0;border-radius:9.6px;background:transparent;color:var(--cc-text);text-align:start;cursor:pointer;transition:background-color 120ms}
.cal-period:hover,.cal-period.is-hover{background:var(--cc-surface-2)}
.cal-plabel{color:var(--cc-muted);font-size:12.48px;line-height:1.2;white-space:nowrap}
.cal-period--today .cal-plabel{color:var(--cc-text);font-weight:700}
.cal-pchip{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 9px;border-radius:14px;color:var(--cc-text);font-size:16px;font-weight:700}
.cal-pchip.h0{min-width:0;padding:0 2px}
.cal-pchip.h1{background:var(--cc-h1)}.cal-pchip.h2{background:var(--cc-h2)}.cal-pchip.h3{background:var(--cc-h3)}.cal-pchip.h4{background:var(--cc-h4)}
.cal-period:not(.cal-period--today) .cal-pchip.h3,.cal-period:not(.cal-period--today) .cal-pchip.h4{color:#212529}
.cal-period--today .cal-pchip{min-width:34px;padding:0 9px;background:var(--cc-ink);color:var(--cc-on-ink)}
.cal-period--today .cal-pchip.h2{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3px var(--cc-h2)}
.cal-period--today .cal-pchip.h3{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3px var(--cc-h3)}
.cal-period--past .cal-pchip{color:var(--cc-danger)}
.cal-period--zero .cal-pchip{color:var(--cc-muted);font-weight:600}
.cal-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-inline-start:auto}
.cal-seg{display:inline-flex;padding:3px;border:1px solid var(--cc-line);border-radius:9.6px;background:var(--cc-surface-2)}
.cal-segbtn{position:relative;display:inline-flex;align-items:center;padding:5.6px 12px;border:0;border-radius:7.2px;background:transparent;color:var(--cc-muted);font-size:13px;cursor:pointer;white-space:nowrap;transition:background-color 120ms,color 120ms}
.cal-segbtn[aria-pressed="true"]{background:var(--cc-surface);color:var(--cc-accent);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.cal-cdark .cal-segbtn[aria-pressed="true"]{color:var(--cc-text)}
.cal-glyph{display:inline-flex;align-items:center}
.cal-segbtn .cal-glyph{margin-right:8px}
.cal-link{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--cc-control);border-radius:9.6px;background:var(--cc-surface);color:var(--cc-accent)}
.cc-root .cal-link{color:var(--cc-accent)}

/* Proposed (round 2): the icon switch beside the title, the grading cell first, one row. */
.cal--after .cal-head{flex-wrap:nowrap}
.cal--after .cal-line{display:flex;align-items:stretch;gap:6px;min-width:0}
.cal--after .cal-period{min-width:64px;padding:4px 10px 5px 8px}
.cal--after .cal-title{margin-right:-4px}
.cal-seg--icons .cal-segbtn{display:grid;place-items:center;width:36px;height:36px;padding:0}
.cal-seg--icons .cal-segbtn .cal-glyph{margin:0}
.cal-queue .cal-pchip{min-width:0;padding:0 2px;background:transparent}
.cal-qdiv{flex:none;width:1px;margin:10px 4px 10px 2px;background:var(--cc-line-2)}
.cal-periods--after{flex-wrap:nowrap}
.is-focus{outline:2px solid var(--cc-accent);outline-offset:2px}
.cal-segbtn.is-hover:not([aria-pressed="true"]){background:color-mix(in oklab,var(--cc-surface) 60%,var(--cc-surface-2));color:var(--cc-text)}

/* The tooltip: the button's own child, aria-hidden (the button's aria-label is the name), drawn in
   core's tooltip look (ink fill, text on ink), shown on hover and on keyboard focus. */
.tip{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);z-index:5;padding:4px 8px;border-radius:6px;background:var(--cc-ink);color:var(--cc-on-ink);font-size:12.5px;font-weight:400;line-height:1.35;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 150ms}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--cc-ink)}
.cal-segbtn:hover .tip,.cal-segbtn:focus-visible .tip,.is-tip .tip{opacity:1}

/* The line cannot fit (a long language, a narrow column above 640 px): it moves under the title
   whole; the switch and the link stay on the first row. */
.cal--twoline .cal-head{flex-wrap:wrap}
.cal--twoline .cal-line{order:3;flex-basis:100%}
.cal--twoline .cal-controls{order:2}

/* Narrow (under 640 px, the phone): row 1 the title, the switch and the link; the grading cell its
   own full-width row; the five periods the grid the student's phone line already is. */
.cal--narrow .cal-head{flex-wrap:wrap;gap:6px 8px}
.cal--narrow .cal-line{order:3;flex-basis:100%;display:flex;flex-direction:column;gap:2px}
.cal--narrow .cal-controls{order:2}
.cal--narrow .cal-periods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.cal--narrow .cal-period{align-items:center;min-width:0;min-height:62px;padding:4px}
.cal--narrow .cal-plabel{font-size:11.5px}
.cal--narrow .cal-queue{align-items:flex-start;width:100%;min-height:56px;padding:4px 10px}
.cal--narrow .cal-qdiv{width:auto;height:1px;margin:2px 4px}
/* Considered and set aside on the phone: a 3 x 2 grid, and six across. */
.cal--grid32 .cal-line{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.cal--grid32 .cal-periods{display:contents}
.cal--grid32 .cal-qdiv{display:none}
.cal--grid32 .cal-queue{align-items:center;min-height:62px;padding:4px;box-shadow:inset -1px 0 0 var(--cc-line-2)}
.cal--six .cal-line{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.cal--six .cal-periods{display:contents}
.cal--six .cal-qdiv{display:none}
.cal--six .cal-queue{align-items:center;min-height:62px;padding:4px 2px;box-shadow:inset -1px 0 0 var(--cc-line-2)}
.cal--six .cal-period{padding:4px 2px}
.cal--six .cal-plabel{font-size:11px}

/* Phone */
.phone{flex:none;width:390px;position:relative;overflow:hidden;border-radius:28px;border:1px solid var(--cc-line-2);background:var(--cc-page);display:flex;flex-direction:column;padding-bottom:16px}
.phone--small{transform-origin:top left}
.ph-bar{height:52px;background:var(--cc-surface);border-bottom:1px solid var(--cc-line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none;font-weight:700;color:var(--cc-text)}
.ph-page{padding:12px}
.ph-page .blk-c{width:auto;padding:10px 12px 2px}

/* The open strip after a press on the grading cell (reduced to what the picture needs). */
.os{width:1034px}
.os-head{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.os-month{margin:0;min-width:248px;font-size:18px;font-weight:600}
.os-today{height:38px;padding:0 12px;border:1px solid var(--cc-control);border-radius:9.6px;background:var(--cc-surface);font-size:13px}
.os-days{display:grid;grid-template-columns:repeat(14,50px);margin-top:14px;padding-bottom:8px}
.os-col{display:flex;flex-direction:column;align-items:center;gap:5px;transition:opacity 180ms}
.os-col.dim{opacity:.26}
.os-wd{font-size:12px;color:var(--cc-muted)}
.os-day{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--cc-text)}
.os-day.h1{background:var(--cc-h1)}.os-day.h2{background:var(--cc-h2)}.os-day.h3{background:var(--cc-h3)}
.os-day.past{color:var(--cc-muted)}
.os-day.today{background:var(--cc-ink);color:var(--cc-on-ink)}
.os-day.lit{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3px var(--cc-accent)}
.os-dots{display:flex;gap:3px;height:8px;align-items:center}
.mk--grade{width:7px;height:7px;background:var(--cc-accent);border-radius:1px;transform:rotate(45deg);display:inline-block}
.mk--class{width:7px;height:7px;border:1.5px solid var(--cc-text-2);border-radius:1.5px;display:inline-block}

/* Anatomy */
.num{width:22px;height:22px;border-radius:50%;background:var(--cc-ink);color:var(--cc-on-ink);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.anat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}

@media (prefers-reduced-motion: reduce){
  .cc-root *{animation:none!important;transition:none!important}
}
</style>

<style>
.dcx-tweaks{position:fixed;right:16px;bottom:16px;z-index:9999;background:#fff;color:#1d2125;border:1px solid #d5dade;
  border-radius:12px;padding:10px 12px;font:13px system-ui,sans-serif;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:6px;min-width:190px}
.dcx-tweaks b{font-weight:600}
.dcx-tweaks label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dcx-tweaks a{color:#0f6cbf}
</style>
</head>
<body>
<div id="dcx-root"></div>
<script type="module">
import { h, render, Component as PreactComponent } from 'https://cdn.jsdelivr.net/npm/preact@10.24.3/dist/preact.module.js';
import htm from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js';
const html = htm.bind(h);
class DCLogic extends PreactComponent {}

class Component extends DCLogic {
  strs(lang) {
    const all = {
      pt_br: {
        region: 'Calendário', learn: 'Estudando', teach: 'Ensinando', views: 'Mostrar a faixa para',
        open: 'Abrir o calendário', periods: 'O seu calendário, por período', tograde: 'A avaliar',
        dashboard: 'Painel', month: 'outubro de 2026', today: 'Hoje',
        fall: 'Tudo', ftodo: 'A fazer', fevents: 'Eventos',
        lead: (n) => n === 1 ? '1 envio aguardando avaliação' : n + ' envios aguardando avaliação',
        subs: (n) => n === 1 ? '1 envio' : n + ' envios',
        gradeLabel: (items) => 'A avaliar: ' + items + '. Abre a faixa nos dias com avaliações.',
        gradeNone: 'A avaliar: nenhum envio aguardando. Abre a faixa.',
        items: (n) => n === 0 ? 'nada em aberto' : (n === 1 ? '1 item' : n + ' itens'),
        opens: 'Abre a faixa nestes dias.', opensPast: 'Abre a faixa nos dias passados.',
        teachLong: ['Avaliação atrasada', 'Hoje', 'Amanhã', 'Esta semana', 'Depois'],
        learnLong: ['Atrasadas, ainda abertas', 'Hoje', 'Amanhã', 'Esta semana', 'Depois'],
        teachShort: ['Atrasada', 'Hoje', 'Amanhã', 'Semana', 'Depois'],
        learnShort: ['Atrasadas', 'Hoje', 'Amanhã', 'Semana', 'Depois'],
        wd: ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'],
        sr: 'Leitor de tela'
      },
      en: {
        region: 'Calendar', learn: 'Studying', teach: 'Teaching', views: 'Show the strip for',
        open: 'Open the calendar', periods: 'Your calendar, by period', tograde: 'To grade',
        dashboard: 'Dashboard', month: 'October 2026', today: 'Today',
        fall: 'Everything', ftodo: 'To do', fevents: 'Events',
        lead: (n) => n === 1 ? '1 submission waiting to grade' : n + ' submissions waiting to grade',
        subs: (n) => n === 1 ? '1 submission' : n + ' submissions',
        gradeLabel: (items) => 'To grade: ' + items + '. Opens the strip on the days with grading work.',
        gradeNone: 'To grade: nothing waiting. Opens the strip.',
        items: (n) => n === 0 ? 'nothing open' : (n === 1 ? '1 item' : n + ' items'),
        opens: 'Opens the strip on these days.', opensPast: 'Opens the strip on the past days.',
        teachLong: ['Grading overdue', 'Today', 'Tomorrow', 'This week', 'Later'],
        learnLong: ['Late, still open', 'Today', 'Tomorrow', 'This week', 'Later'],
        teachShort: ['Overdue', 'Today', 'Tomorrow', 'Week', 'Later'],
        learnShort: ['Late', 'Today', 'Tomorrow', 'Week', 'Later'],
        wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
        sr: 'Screen reader'
      }
    };
    return all[lang] || all.pt_br;
  }

  data(name) {
    // [count, heat step] per period: late, today, tomorrow, this week, later; and the waiting count.
    const sets = {
      shot: { waiting: 0, p: [[0, 0], [1, 0], [1, 2], [0, 0], [0, 0]] },
      busy: { waiting: 3, p: [[1, 0], [2, 3], [2, 2], [4, 3], [6, 1]] },
      student: { waiting: 0, p: [[2, 0], [3, 2], [1, 1], [8, 3], [18, 2]] }
    };
    return sets[name];
  }

  // One closed line, as a frame: o.mode before|after, o.view teach|learn, o.set shot|busy|student.
  line(s, o) {
    const teach = o.view === 'teach';
    const after = o.mode === 'after';
    const d = this.data(o.set);
    const narrow = !!o.narrow;
    const longs = teach ? s.teachLong : s.learnLong;
    const shorts = teach ? s.teachShort : s.learnShort;
    const keys = ['late', 'today', 'tomorrow', 'week', 'later'];
    const periods = d.p.map((pair, i) => {
      const n = pair[0];
      const key = keys[i];
      const long = longs[i];
      // The built rule: a name over 14 characters, or a narrow block, draws the short twin.
      const label = (narrow || long.length > 14) ? shorts[i] : long;
      const level = key === 'late' ? 0 : pair[1];
      const cls = ['cal-period',
        key === 'today' ? 'cal-period--today' : '',
        key === 'late' ? 'cal-period--past' : '',
        n === 0 ? 'cal-period--zero' : ''].filter(Boolean).join(' ');
      return {
        cls: cls,
        chipCls: 'cal-pchip h' + level,
        label: label,
        title: label === long ? '' : long,
        n: n,
        sentence: long + ': ' + s.items(n) + '. ' + (key === 'late' ? s.opensPast : s.opens)
      };
    });
    const focus = o.focus || '';
    const segCls = (which) => ['cal-segbtn',
      focus === which ? 'is-focus' : '',
      o.hover === which ? 'is-hover' : '',
      o.tip === which ? 'is-tip' : ''].filter(Boolean).join(' ');
    const grading = after && teach && !o.noGrading;
    const waiting = d.waiting;
    const w = o.w;
    const phone = w === 'phone';
    const cls = ['cal',
      after ? 'cal--after' : 'cal--before',
      narrow ? 'cal--narrow' : '',
      o.twoline ? 'cal--twoline' : '',
      o.alt ? 'cal--' + o.alt : ''].filter(Boolean).join(' ');
    return {
      id: o.id,
      tag: o.tag,
      tagCls: 'tag ' + (o.tagCls || (after ? 'tag--rec' : 'tag--before')),
      title: o.title,
      wlabel: phone ? '390 px phone, strip ' + (o.stripw || '') : 'strip ' + w + ' px',
      phone: phone,
      shellCls: phone ? 'phone' + (o.dark ? ' cc-dark' : '') : '',
      shellStyle: '',
      pageCls: phone ? 'ph-page' : '',
      blockCls: 'blk-c' + (o.tips ? ' blk-c--tips' : '') + (o.dark && !phone ? ' cc-dark' : ''),
      cls: cls,
      wcss: phone ? 'auto' : w + 'px',
      iconSwitch: after && !o.noSwitch,
      textSwitch: !after && !o.noSwitch,

      '  </div>',
      '  <div class="compass-cal-controls"><a aria-label="' + s.open + '">…</a></div>',
      '</div>'
    ].join('\n');

    return {
      themeCls: dark ? 'cc-dark' : '',
      s: s,
      sections: sections,
      days: days,
      strings: strings,
      outline: outline
    };
  }

const TWEAKS = {"lang": {"editor": "enum", "options": ["pt_br", "en"], "default": "pt_br", "section": "Language"}, "dark": {"editor": "boolean", "default": false, "section": "Theme"}};
class Shell extends PreactComponent {
  constructor(props) { super(props); this.state = {"lang": "pt_br", "dark": false}; }
  render() {
    const rows = Object.entries(TWEAKS).map(([key, t]) => {
      const set = (value) => this.setState({ [key]: value });
      if (t.editor === 'boolean') {
        return html`<label>${key} <input type="checkbox" checked=${!!this.state[key]} onChange=${(e) => set(e.target.checked)} /></label>`;
      }
      if (t.editor === 'enum') {
        return html`<label>${key} <select value=${this.state[key]} onChange=${(e) => set(e.target.value)}>
          ${t.options.map((o) => html`<option value=${o}>${o}</option>`)}</select></label>`;
      }
      if (t.editor === 'range' || t.editor === 'int') {
        return html`<label>${key} <input type="number" min=${t.min} max=${t.max} step=${t.step || 1} value=${this.state[key]}
          onChange=${(e) => set(Number(e.target.value))} style="width: 80px" /></label>`;
      }
      return null;
    });
    return html`<${Component} ...${this.state} />${rows.length ? html`<aside class="dcx-tweaks" aria-label="Mockup tweaks">
      <b>Tweaks</b>${rows}<a href="index.html">All artboards</a></aside>` : html`<aside class="dcx-tweaks"><a href="index.html">All artboards</a></aside>`}`;
  }
}
render(html`<${Shell} />`, document.getElementById('dcx-root'));
