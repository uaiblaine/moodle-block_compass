<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass calendar strip</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0f6cbf}a:hover{color:#0a4f8c}
.cc-root{
  --cc-page:#f4f5f7;--cc-surface:#fff;--cc-surface-2:#f6f7f9;--cc-text:#1d2125;--cc-text-2:#454c53;--cc-muted:#68717a;
  --cc-line:#e4e7eb;--cc-line-2:#d5dade;--cc-accent:#0f6cbf;--cc-on-accent:#fff;--cc-danger:#ca3120;--cc-warn:#f0ad4e;
  --cc-ink:#121518;--cc-on-ink:#fff;--cc-hatch:#d4d9de;
  --cc-h1:color-mix(in oklab,var(--cc-warn) 17%,var(--cc-surface));
  --cc-h2:color-mix(in oklab,var(--cc-warn) 36%,var(--cc-surface));
  --cc-h3:color-mix(in oklab,var(--cc-warn) 62%,var(--cc-surface));
  --cc-h4:color-mix(in oklab,var(--cc-warn) 92%,var(--cc-surface));
  --cc-glass:color-mix(in srgb,var(--cc-surface) 90%,transparent);
  --cc-shadow:0 28px 64px -18px rgba(16,24,40,.32),0 3px 10px rgba(16,24,40,.08);
  --activityassessment:#f90086;--activitycollaboration:#5b40ff;--activitycommunication:#eb6200;--activitycontent:#0099ad;--activityadministration:#da58ef;
  font-family:'Noto Sans',system-ui,sans-serif;background:var(--cc-page);color:var(--cc-text);min-height:100vh;
  font-variant-numeric:tabular-nums;font-size:15px;line-height:1.45;
}
.cc-root.cc-dark{
  --cc-page:#0f1113;--cc-surface:#1a1d20;--cc-surface-2:#22262a;--cc-text:#eceef0;--cc-text-2:#c4c9ce;--cc-muted:#99a1a9;
  --cc-line:#2c3135;--cc-line-2:#3a4045;--cc-danger:#ff7b6b;--cc-warn:#f2b45c;
  /* Dark-aware ink (ADR-014 amendment 10): Bootstrap keeps the primary in dark mode, so marks and accent
     text take color-mix(primary 35%, body colour), 5.99:1 for a navy brand and 8.03:1 for Boost's blue. */
  --cc-accent:color-mix(in oklab,#0f6cbf 35%,#eceef0);--cc-on-accent:#0b1a29;
  --cc-h3:color-mix(in oklab,var(--cc-warn) 80%,var(--cc-surface));
  --cc-ink:#f3f4f6;--cc-on-ink:#111417;--cc-hatch:#353b40;
  --cc-shadow:0 28px 64px -18px rgba(0,0,0,.7),0 3px 10px rgba(0,0,0,.4);
}
.cc-root *{box-sizing:border-box}
.cc-root button{font:inherit;color:inherit}
.cc-root :focus-visible{outline:2px solid var(--cc-accent);outline-offset:3px}

/* Page chrome */
.cc-nav{height:60px;background:var(--cc-surface);border-bottom:1px solid var(--cc-line);display:flex;align-items:center;gap:28px;padding:0 24px}
.cc-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--cc-text)}
.cc-navlinks{display:flex;gap:4px;flex-wrap:wrap}
.cc-navlinks a{color:var(--cc-text-2);text-decoration:none;padding:18px 10px;font-size:14px;border-bottom:3px solid transparent}
.cc-navlinks a[aria-current="page"]{color:var(--cc-text);border-bottom-color:var(--cc-accent);font-weight:600}
.cc-navright{margin-left:auto;display:flex;align-items:center;gap:12px}
.cc-avatar{width:34px;height:34px;border-radius:50%;background:var(--cc-surface-2);border:1px solid var(--cc-line);display:grid;place-items:center;font-size:13px;font-weight:600}
.cc-wrap{max-width:1240px;margin:0 auto;padding:28px 24px 72px}
.cc-pagehead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.cc-h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em}
.cc-btn{border:1px solid var(--cc-line-2);background:var(--cc-surface);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
.cc-iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--cc-line);background:var(--cc-surface);display:grid;place-items:center;cursor:pointer;color:var(--cc-text-2);transition:background-color 120ms,border-color 120ms}
.cc-iconbtn:hover{background:var(--cc-surface-2);border-color:var(--cc-line-2)}
.cc-iconbtn[disabled]{opacity:.35;cursor:default}

/* Block */
.cc-block{background:var(--cc-surface);border:1px solid var(--cc-line);border-radius:14px}
.cc-bhead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--cc-line)}
.cc-bhead h2{margin:0;font-size:18px;font-weight:600}
.cc-bbody{padding:8px 22px 26px}

/* Strip head */
.cc-strip{position:relative;padding:14px 0 6px}
.cc-shead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.cc-stitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cc-stitle h3{margin:0;font-size:16px;font-weight:600}
.cc-stitle span{color:var(--cc-muted);font-size:14px}
.cc-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cc-segctl{display:inline-flex;background:var(--cc-surface-2);border:1px solid var(--cc-line);border-radius:10px;padding:3px}
.cc-segbtn{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--cc-text-2);transition:background-color 120ms,color 120ms}
.cc-segbtn[aria-pressed="true"]{background:var(--cc-surface);color:var(--cc-text);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.cc-switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--cc-text-2);cursor:pointer;padding:0 4px;min-height:38px}
.cc-switch input{position:absolute;opacity:0;width:1px;height:1px}
.cc-switch-track{width:34px;height:20px;border-radius:20px;background:var(--cc-line-2);position:relative;transition:background-color 140ms;flex:none}
.cc-switch-track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--cc-surface);transition:transform 160ms;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.cc-switch input:checked + .cc-switch-track{background:var(--cc-accent)}
.cc-switch input:checked + .cc-switch-track::after{transform:translateX(14px)}
.cc-switch input:focus-visible + .cc-switch-track{outline:2px solid var(--cc-accent);outline-offset:3px}
.cc-navpair{display:inline-flex;gap:6px}
.cc-todaybtn{height:38px;border-radius:10px;border:1px solid var(--cc-line);background:var(--cc-surface);padding:0 12px;font-size:13px;cursor:pointer}

/* Month navigation */
.cc-monthnav{display:flex;align-items:center;gap:8px}
.cc-month{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;min-width:232px;text-align:center}
.cc-todaybtn[disabled]{opacity:.45;cursor:default}
.cc-calink{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--cc-line);text-decoration:none;font-size:13px;color:var(--cc-text-2);background:var(--cc-surface)}
.cc-calink:hover{background:var(--cc-surface-2);color:var(--cc-text)}
/* Month rail (removed from the design; kept unused) */
.cc-months{display:flex;justify-content:center;align-items:baseline;gap:44px;margin:22px 0 4px;white-space:nowrap;overflow:hidden}
.cc-mo{border:0;background:transparent;padding:4px 2px;font-size:22px;font-weight:500;letter-spacing:-.01em;color:var(--cc-muted);cursor:pointer;transition:color 160ms}
.cc-mo:hover{color:var(--cc-text-2)}
.cc-mo--active{color:var(--cc-text);font-weight:600}
.cc-mo--far{opacity:.35;cursor:default}
.cc-mo--edge{opacity:.16;cursor:default}

/* Days */
.cc-daysbox{position:relative;margin-top:14px}
.cc-days{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));column-gap:6px;align-items:start}
.cc-days--15{grid-template-columns:repeat(15,minmax(0,1fr))}
.cc-fade{position:absolute;top:0;bottom:22px;width:84px;pointer-events:none;z-index:3}
.cc-fade--l{left:0;background:linear-gradient(90deg,var(--cc-surface) 8%,transparent)}
.cc-fade--r{right:0;background:linear-gradient(270deg,var(--cc-surface) 8%,transparent)}
.cc-col{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:12px;transition:opacity 180ms}
.cc-col.cc-dim{opacity:.26}
.cc-needle{position:absolute;top:0;left:50%;width:10px;height:8px;margin-left:-5px;background:var(--cc-accent);clip-path:polygon(0 0,100% 0,50% 100%)}
.cc-day{position:relative;width:100%;max-width:44px;height:auto;aspect-ratio:1/1;padding:0;border-radius:50%;border:0;display:grid;place-items:center;font-size:17px;font-weight:600;cursor:pointer;background:transparent;color:var(--cc-text);
  transition:background-color 160ms,box-shadow 160ms,transform 160ms,color 160ms}
.cc-day:hover{background:var(--cc-surface-2)}
.cc-h1{background:var(--cc-h1)}.cc-h1:hover{background:var(--cc-h1)}
.cc-h2{background:var(--cc-h2)}.cc-h2:hover{background:var(--cc-h2)}
.cc-h3{background:var(--cc-h3)}.cc-h3:hover{background:var(--cc-h3)}
.cc-h4{background:var(--cc-h4)}.cc-h4:hover{background:var(--cc-h4)}
.cc-dark .cc-h3,.cc-dark .cc-h4{color:#1d2125}
.cc-day.cc-off{background:repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 6px);color:var(--cc-muted)}
/* The institution's holiday or recess (block_feedback_tracker's calendar): cross-hatched, so it differs from a weekend by shape. */
.cc-day.cc-hol{background:repeating-linear-gradient(45deg,var(--cc-hatch) 0 1px,transparent 1px 6px),repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 6px);color:var(--cc-muted)}
.cc-wd--off,.cc-wd--hol{position:relative}
.cc-wd--off::after,.cc-wd--hol::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-6px;height:5px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 4px)}
.cc-wd--hol::after{background:repeating-linear-gradient(45deg,var(--cc-hatch) 0 1px,transparent 1px 4px),repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 4px)}
.cc-swatch{width:12px;height:12px;border-radius:50%;border:1px solid var(--cc-line-2);flex:none}
.cc-swatch--off{background:repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 3px)}
.cc-swatch--hol{background:repeating-linear-gradient(45deg,var(--cc-hatch) 0 1px,transparent 1px 3px),repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 3px)}
.cc-day.cc-past{color:var(--cc-muted)}
.cc-day.cc-past.cc-h0:not(.cc-off):not(.cc-hol){background:color-mix(in oklab,var(--cc-surface-2) 70%,transparent)}

.cc-day.cc-today{background:var(--cc-ink);color:var(--cc-on-ink);box-shadow:0 12px 24px -10px rgba(0,0,0,.55)}
.cc-day.cc-today.cc-h2{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3px var(--cc-h2),0 12px 24px -10px rgba(0,0,0,.55)}
.cc-day.cc-today.cc-h3{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3px var(--cc-h3),0 12px 24px -10px rgba(0,0,0,.55)}
.cc-day.cc-today.cc-h4{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3px var(--cc-h4),0 12px 24px -10px rgba(0,0,0,.55)}
.cc-day.cc-open{transform:translateY(-3px)}
.cc-day.cc-pinned{outline:2px solid var(--cc-accent);outline-offset:1px}
.cc-day.cc-soon{box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3px var(--cc-accent)}
.cc-col.cc-match .cc-day{transform:translateY(-3px);box-shadow:0 0 0 1.5px var(--cc-surface),0 0 0 3px var(--cc-accent)}
.cc-dots{display:flex;align-items:center;justify-content:center;gap:3px;height:8px}
.cc-dot{width:6px;height:6px;border-radius:50%;flex:none}
.cc-dot--due{background:var(--cc-accent)}
.cc-dot--event{width:7px;height:7px;border:1.5px solid var(--cc-text-2)}
.cc-dot--overdue{background:var(--cc-danger);border-radius:1px;transform:rotate(45deg);width:6px;height:6px}
.cc-dot--graded{background:var(--cc-accent);border-radius:1.5px;width:7px;height:7px}
.cc-dot--urgent{background:var(--cc-accent);border-radius:1.5px;width:7px;height:7px;box-shadow:0 0 0 2px var(--cc-surface),0 0 0 3.5px var(--cc-accent)}
.cc-dot--late{border:1.5px solid var(--cc-danger);border-radius:1px;transform:rotate(45deg);width:6px;height:6px}
.cc-dot--grade{background:var(--cc-accent);border-radius:1px;transform:rotate(45deg);width:7px;height:7px}
.cc-dot--gradesoon{background:var(--cc-accent);border-radius:1px;transform:rotate(45deg);width:7px;height:7px;box-shadow:0 0 0 2px var(--cc-surface),0 0 0 3.5px var(--cc-accent)}
.cc-dot--class{border:1.5px solid var(--cc-text-2);border-radius:1.5px;width:7px;height:7px;opacity:.8}
.cc-mode .cc-segbtn{display:inline-flex;align-items:center;gap:6px}
.cc-mode svg{flex:none}
.cc-dot--done{background:var(--cc-muted);opacity:.4;width:5px;height:5px}
.cc-more{font-size:10px;font-weight:600;color:var(--cc-muted);margin-left:1px;line-height:8px}
.cc-wd{font-size:12.5px;color:var(--cc-muted)}
.cc-col--today .cc-wd{color:var(--cc-text);font-weight:600}
.cc-ring{position:absolute;left:-6px;top:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg);pointer-events:none;display:none}
.cc-ring circle{fill:none;stroke-width:3;stroke-linecap:round;stroke:transparent}
.cc-ring .cc-seg--due{stroke:var(--cc-accent)}
.cc-ring .cc-seg--event{stroke:var(--cc-text-2)}
.cc-ring .cc-seg--overdue{stroke:var(--cc-danger)}
.cc-ring .cc-seg--done{stroke:var(--cc-line-2)}
.cc-ring .cc-seg--graded,.cc-ring .cc-seg--urgent{stroke:var(--cc-accent)}
.cc-ring .cc-seg--late{stroke:var(--cc-danger);opacity:.55}
.cc-ring .cc-seg--grade,.cc-ring .cc-seg--gradesoon{stroke:var(--cc-accent)}
.cc-ring .cc-seg--class{stroke:var(--cc-text-2);opacity:.5}
.cc-bar{display:none;width:20px;border-radius:7px;background:var(--cc-line);transition:height 200ms}
.cc-bar.cc-h1{background:var(--cc-h1)}.cc-bar.cc-h2{background:var(--cc-h2)}.cc-bar.cc-h3{background:var(--cc-h3)}.cc-bar.cc-h4{background:var(--cc-h4)}
.cc-bar.cc-barover{background:var(--cc-danger)}
.cc-barbox{display:none;height:56px;align-items:flex-end}
.cc-style-ring .cc-ring{display:block}
.cc-style-ring .cc-dots{visibility:hidden}
.cc-style-pulse .cc-barbox{display:flex}
.cc-style-pulse .cc-bar{display:block}
.cc-style-pulse .cc-dots{display:none}
.cc-style-pulse .cc-day{max-width:36px;font-size:14px}
.cc-style-pulse .cc-day.cc-h1,.cc-style-pulse .cc-day.cc-h2,.cc-style-pulse .cc-day.cc-h3,.cc-style-pulse .cc-day.cc-h4{background:transparent;color:var(--cc-text)}
.cc-style-pulse .cc-day.cc-today{background:var(--cc-ink);color:var(--cc-on-ink)}
.cc-track{position:relative;height:2px;background:var(--cc-line);margin:16px 6% 0;border-radius:2px}
.cc-track-mark{position:absolute;top:-1px;height:4px;display:flex;justify-content:center;transition:left 240ms}
.cc-track-mark::after{content:"";width:62%;height:4px;border-radius:4px;background:var(--cc-text)}
.cc-sfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--cc-muted)}
.cc-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.cc-legend span{display:inline-flex;align-items:center;gap:6px}
.cc-sfoot-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.cc-cost{display:inline-flex;align-items:center;gap:8px}
.cc-cost b{color:var(--cc-text-2);font-weight:600}

/* Hover card */
.cc-pop{position:absolute;top:calc(100% + 4px);z-index:40;width:400px;max-width:calc(100vw - 32px);background:var(--cc-glass);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--cc-line);border-radius:18px;box-shadow:var(--cc-shadow);text-align:left;
  animation:cc-pop-in 170ms cubic-bezier(.2,.8,.2,1)}
.cc-pop--center{left:50%;transform:translateX(-50%)}
.cc-pop--start{left:50%;transform:translateX(-38px)}
.cc-pop--end{right:50%;transform:translateX(38px)}
.cc-pop--pinned{border-color:color-mix(in oklab,var(--cc-accent) 45%,var(--cc-line))}
@keyframes cc-pop-in{from{opacity:0;translate:0 -6px;scale:.985}to{opacity:1;translate:0 0;scale:1}}
.cc-arrow{position:absolute;top:-7px;width:13px;height:13px;background:var(--cc-surface);border-left:1px solid var(--cc-line);border-top:1px solid var(--cc-line);transform:rotate(45deg)}
.cc-pop--center .cc-arrow{left:calc(50% - 6.5px)}
.cc-pop--start .cc-arrow{left:31px}
.cc-pop--end .cc-arrow{right:31px}
.cc-phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.cc-ptitle{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.005em}
.cc-psub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--cc-muted)}
.cc-rel{padding:1px 8px;border-radius:20px;background:var(--cc-surface-2);border:1px solid var(--cc-line);color:var(--cc-text-2);font-weight:600}
.cc-rel--today{background:var(--cc-ink);border-color:var(--cc-ink);color:var(--cc-on-ink)}
.cc-offchip{padding:1px 8px;border-radius:20px;border:1px dashed var(--cc-line-2);color:var(--cc-text-2)}
.cc-x{width:32px;height:32px;border-radius:9px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--cc-muted)}
.cc-x:hover{background:var(--cc-surface-2);color:var(--cc-text)}
.cc-sumbar{display:flex;gap:3px;height:6px;margin:2px 18px 0}
.cc-sumbar span{border-radius:6px;min-width:0}
.cc-sb-over{background:var(--cc-danger);opacity:.55}.cc-sb-g{background:var(--cc-accent)}.cc-sb-due{background:color-mix(in oklab,var(--cc-accent) 45%,var(--cc-surface))}.cc-sb-ev{background:var(--cc-text-2);opacity:.55}.cc-sb-done{background:var(--cc-line-2)}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px 2px}
.cc-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--cc-text-2);background:var(--cc-surface-2);border:1px solid var(--cc-line);border-radius:20px;padding:2px 9px}
.cc-list{list-style:none;margin:0;padding:8px 8px 4px;max-height:372px;overflow:auto}
.cc-it{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:12px;transition:background-color 120ms}
.cc-it:hover{background:color-mix(in oklab,var(--cc-surface-2) 85%,transparent)}
.cc-it--done{opacity:.62}
.cc-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--p);background:color-mix(in oklab,var(--p) 13%,var(--cc-surface))}
.cc-ico--assessment{--p:var(--activityassessment)}.cc-ico--collaboration{--p:var(--activitycollaboration)}
.cc-ico--communication{--p:var(--activitycommunication)}.cc-ico--content{--p:var(--activitycontent)}.cc-ico--administration{--p:var(--activityadministration)}
.cc-dark .cc-ico{background:color-mix(in oklab,var(--p) 26%,var(--cc-surface));color:color-mix(in oklab,var(--p) 55%,#fff)}
.cc-itop{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--cc-muted);min-width:0}
.cc-ccourse{display:inline-flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-cdot{width:7px;height:7px;border-radius:2px;flex:none}
.cc-ititle{display:block;color:var(--cc-text);font-weight:600;font-size:14px;text-decoration:none;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-ititle:hover{text-decoration:underline;color:var(--cc-text)}
.cc-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.cc-badge{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--cc-surface-2);color:var(--cc-text-2);border:1px solid var(--cc-line)}
.cc-badge--over{background:color-mix(in oklab,var(--cc-danger) 12%,var(--cc-surface));color:var(--cc-danger);border-color:color-mix(in oklab,var(--cc-danger) 30%,var(--cc-surface))}
.cc-badge--urgent{background:var(--cc-accent);color:var(--cc-on-accent);border-color:var(--cc-accent)}

const html = htm.bind(h);
class DCLogic extends PreactComponent {}

class Component extends DCLogic {
  constructor(props) {

  data() {

    };
    // The same person teaches two courses: editing teacher in one, a monitor who does not grade in the other.
    const TEACH = {
      '2026-10-08': [{ c: 'ip', m: 'assign', t: 'Lab 2: loops', time: '23:59', waiting: 9 }],
      '2026-10-13': [{ c: 'ip', m: 'assign', t: 'Lab 3: recursion', time: '18:00', waiting: 14 }, { c: 'ca', m: 'quiz', t: 'Quiz 4', time: '23:59', cls: true, learners: 38 }],

    };
    const ITEMS = {

      '2026-10-21': [{ c: 'ee', m: 'forum', t: 'Week 7 discussion', time: '18:00' }, { c: 'tw', m: 'assign', t: 'Memo, final version', time: '23:59', g: true, comp: true }],
      '2026-10-22': [{ c: 'oc', m: 'assign', t: 'Lab report 4', time: '23:59', g: true, comp: true }, { c: 'oc', m: 'quiz', t: 'Pre-lab quiz 5', time: '08:00', g: true }, { c: 'la', m: 'quiz', t: 'Weekly check 6', time: '23:59', g: true }, { c: 'la', m: 'session', t: 'Tutorial, group B', time: '10:00', ev: true }, { c: 'ee', m: 'workshop', t: 'Peer review: second case study', time: '20:00', g: true }, { c: 'tw', m: 'forum', t: 'Style clinic questions', time: '16:00' }],
      '2026-10-23': [{ c: 'ds', m: 'assign', t: 'Exercise set 6', time: '23:59', g: true }],
      '2026-10-26': [{ c: 'la', m: 'assign', t: 'Problem set 6', time: '23:59', g: true }],
      '2026-10-27': [{ c: 'oc', m: 'session', t: 'Lab session 5', time: '14:00', ev: true }],
      '2026-10-29': [{ c: 'ds', m: 'quiz', t: 'Quiz 5: graphs', time: '23:59', g: true, comp: true }],
      '2026-10-30': [{ c: 'ee', m: 'assign', t: 'Essay outline', time: '23:59', g: true, comp: true }, { c: 'tw', m: 'assign', t: 'Report draft', time: '23:59', g: true }],
      '2026-11-02': [{ c: 'site', m: 'site', t: 'Public holiday, no classes', time: 'All day', ev: true }],
      '2026-11-03': [{ c: 'la', m: 'quiz', t: 'Weekly check 7', time: '23:59', g: true }],
      '2026-11-05': [{ c: 'ds', m: 'assign', t: 'Project milestone 3', time: '23:59', g: true, comp: true }, { c: 'oc', m: 'assign', t: 'Lab report 5', time: '23:59', g: true, comp: true }, { c: 'ee', m: 'forum', t: 'Week 9 discussion', time: '18:00' }],
      '2026-11-10': [{ c: 'la', m: 'quiz', t: 'Weekly check 8', time: '23:59', g: true }, { c: 'oc', m: 'session', t: 'Lab session 6', time: '14:00', ev: true }],
      '2026-11-12': [{ c: 'tw', m: 'assign', t: 'Final report', time: '23:59', g: true, comp: true }],
      '2026-11-17': [{ c: 'ds', m: 'quiz', t: 'Quiz 6: shortest paths', time: '23:59', g: true, comp: true }, { c: 'ee', m: 'forum', t: 'Week 11 discussion', time: '18:00' }],
      '2026-11-19': [{ c: 'oc', m: 'quiz', t: 'Pre-lab quiz 7', time: '08:00', g: true }],
      '2026-11-24': [{ c: 'ds', m: 'assign', t: 'Final project', time: '23:59', g: true, comp: true }, { c: 'la', m: 'assign', t: 'Problem set 9', time: '23:59', g: true }],
      '2026-11-26': [{ c: 'site', m: 'site', t: 'Teaching term ends', time: 'All day', ev: true }],
      '2026-11-30': [{ c: 'ee', m: 'assign', t: 'Final essay', time: '23:59', g: true, comp: true }]
    };
    // The institution's days off, from block_feedback_tracker's calendar when it is installed (ADR-014
    // amendment 10); without it only core's weekend is marked.
    const DAYSOFF = {
      '2026-10-12': { type: 'Holiday', note: 'Founders\u2019 Day' },
      '2026-10-19': { type: 'Recess', note: 'Mid-term break' }
    };
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    const days = [];
    for (let i = 0; i < NDAYS; i++) {
      const dt = new Date(START + i * MS);
      const key = dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate());
      const items = [];
      (ITEMS[key] || []).forEach((r) => {
        const c = COURSES[r.c];
        let kind;
        if (r.ev) {
          kind = 'event';
        } else if (r.done) {
          kind = 'done';
        } else if (i < TODAY) {
          if (!r.late) {
            return;
          }
          kind = 'late';
        } else {
          kind = r.g ? 'graded' : 'due';
        }
        const urgent = kind === 'graded' && (i === TODAY || i === TODAY + 1);
        let w = 0;
        if (kind === 'late') {
          w = 1;
        } else if (kind === 'event') {
          w = 0.5;
        } else if (kind === 'due' || kind === 'graded') {
          w = (c.fav ? 1.5 : 1) * (c.active ? 1.5 : 1) * (r.comp ? 1.5 : 1) * (r.g ? 1.5 : 1) + (urgent ? 3 : 0);
        }
        items.push(Object.assign({}, r, { kind: urgent ? 'urgent' : kind, w: w, course: c.name, hue: c.hue, fav: c.fav }));
      });
      const titems = (TEACH[key] || []).map((r) => {
        const c = COURSES[r.c];
        let kind = r.ev ? 'event' : (r.cls ? 'class' : 'grade');
        if (kind === 'grade' && (i === TODAY || i === TODAY + 1)) {
          kind = 'gradesoon';
        }
        let w = 0.5;
        if (kind === 'grade' || kind === 'gradesoon') {
          w = 1.5 + Math.min(r.waiting, 30) / 10 + (kind === 'gradesoon' ? 2 : 0);
        }
        return Object.assign({}, r, { kind: kind, w: w, course: c.name, hue: c.hue, fav: false });
      });
      days.push({ i: i, key: key, wdn: dt.getUTCDay(), num: dt.getUTCDate(), month: dt.getUTCMonth(), year: dt.getUTCFullYear(), items: items, titems: titems, dayoff: DAYSOFF[key] || null });
    }
    const CARDS = [
      { c: 'ds', title: 'Data Structures', cat: 'Computer Science · Semester 2', pct: 62, badge: 'Graded, due today', badgeCls: 'cc-cbadge cc-cbadge--accent', next: 'Quiz 4: trees and heaps · today, 23:59', day: 10, fav: true, bg: '#dbe6f2', fg: '#3b6ea8', x1: 250, x2: 70, tri: 'M120 118 L170 40 L220 118 Z' },
      { c: 'oc', title: 'Organic Chemistry II', cat: 'Chemistry · Semester 2', pct: 41, badge: 'Late, still open', badgeCls: 'cc-cbadge cc-cbadge--warn', next: 'Lab report 3 · accepted until 20 October', day: 5, fav: false, bg: '#f2e5d7', fg: '#9a6331', x1: 60, x2: 240, tri: 'M150 0 L210 80 L90 80 Z' },

  win() {
    return (this.props.stripStyle ?? 'dots') === 'ring' ? 15 : 21;
  }

  bounds() {
    const D = this.data();
    const w = this.win();
    const min = D.TODAY - Math.floor(w / 2);
    return { min: min, max: D.days.length - w };
  }

  curOff() {
    const b = this.bounds();
    const off = this.state.off === null ? b.min : this.state.off;
    return Math.max(b.min, Math.min(b.max, off));
  }

  componentDidMount() {
    this.boot(false);
  }

  boot(returning) {
    const latency = this.props.latency ?? 450;
    this.later(() => {
      this.setState({ cardsReady: true });
      this.addLog({ tag: 'tier1', name: 'block_compass_get_attention', detail: 'tier 1 first: the cards paint before anything else is asked', ms: '39 ms', kb: '3.1 KB' });
      this.later(() => {
        this.setState({ stripReady: true });
        if (returning) {
          this.addLog({ tag: 'cache', name: 'block_compass_get_strip', detail: 'asked after tier 1 · same sign-in: from the user’s cache, no event query', ms: '6 ms', kb: '0.9 KB' });
        } else {
          this.addLog({ tag: 'strip', name: 'block_compass_get_strip', detail: 'asked after tier 1 · 3 Oct to 30 Nov · past exact, the rest counted · cached for this sign-in', ms: '41 ms', kb: '0.9 KB' });
        }
        this.later(() => this.ensure(this.data().TODAY, 'idle'), 1200);
      }, returning ? 120 : latency);
    }, Math.round(latency * 0.7));
  }

  componentWillUnmount() {
    this.timers.forEach((t) => clearTimeout(t));
  }

  later(fn, ms) {
    const t = setTimeout(fn, ms);
    this.timers.push(t);
    return t;
  }

  addLog(entry) {
    this.seq += 1;
    const e = Object.assign({ id: this.seq }, entry);
    this.setState((st) => ({ log: [e].concat(st.log).slice(0, 9) }));
  }

  ensure(i, tag) {
    const D = this.data();
    if (i < 0 || i >= D.days.length) {
      return;
    }
    const st = this.state;
    if (st.loaded[i] || st.loading[i]) {
      return;
    }
    this.setState((s) => ({ loading: Object.assign({}, s.loading, { [i]: true }) }));
    const latency = this.props.latency ?? 450;
    const background = tag === 'prefetch' || tag === 'idle';
    const delay = Math.round((background ? latency * 0.6 : latency) + Math.random() * 120);
    this.later(() => {
      const n = D.days[i].items.length;
      const ms = 34 + Math.round(Math.random() * 30);
      this.setState((s) => ({
        loading: Object.assign({}, s.loading, { [i]: false }),
        loaded: Object.assign({}, s.loaded, { [i]: true }),
        meta: Object.assign({}, s.meta, { [i]: { ms: ms, by: tag, hits: 0 } })
      }));
      this.addLog({ tag: tag, name: 'block_compass_get_day', detail: D.days[i].key + ' · ' + n + (n === 1 ? ' item' : ' items'), ms: ms + ' ms', kb: (0.5 + n * 0.62).toFixed(1) + ' KB' });
      if (!background) {
        this.later(() => this.ensure(i + 1, 'prefetch'), 260);
      }
    }, delay);
  }

  touch(i) {
    const st = this.state;
    if (st.loaded[i]) {
      const m = st.meta[i] || { ms: 0, by: 'hover', hits: 0 };
      this.setState({ meta: Object.assign({}, st.meta, { [i]: Object.assign({}, m, { hits: m.hits + 1 }) }) });
    } else {
      this.ensure(i, 'hover');
    }
  }

  openDay(i) {
    this.setState({ hover: i });
    this.touch(i);
  }

  enterDay(i) {
    clearTimeout(this.closeT);
    if (this.state.pinned !== null) {
      return;
    }
    clearTimeout(this.openT);
    if (this.state.hover === i) {
      return;
    }
    this.openT = this.later(() => this.openDay(i), this.state.hover === null ? 120 : 40);
  }

  clickDay(i) {
    clearTimeout(this.openT);
    if (this.state.pinned === i) {
      this.setState({ pinned: null });
      return;
    }
    this.setState({ pinned: i, hover: i });
    this.touch(i);
  }

  closeAll() {
    clearTimeout(this.openT);
    this.setState({ pinned: null, hover: null });
  }

  shift(off) {
    const b = this.bounds();
    this.closeAll();
    this.setState({ off: Math.max(b.min, Math.min(b.max, off)) });
  }

  switchMode(mode) {
    if (this.state.mode === mode) {
      return;
    }
    this.closeAll();
    this.setState({ mode: mode, loaded: {}, meta: {} });
    this.addLog({ tag: 'local', name: 'view switch', detail: 'both views travel in the strip payload: no request', ms: '0 ms', kb: '0 KB' });
    this.addLog({ tag: 'pref', name: 'core_user_set_user_preferences', detail: 'block_compass_calendar view=' + mode + ' (remembered)', ms: '9 ms', kb: '0.1 KB' });
  }

  rel(i, today) {
    const n = i - today;
    if (n === 0) {
      return 'Today';
    }
    if (n === 1) {
      return 'Tomorrow';
    }
    if (n === -1) {
      return 'Yesterday';
    }
    return n > 0 ? 'In ' + n + ' days' : -n + ' days ago';
  }

  renderVals() {
    const D = this.data();
    const st = this.state;
    const TODAY = D.TODAY;
    const WIN = this.win();
    const off = this.curOff();
    const bnd = this.bounds();
    const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const ACT = { quiz: 'Attempt quiz now', assign: 'Add submission', forum: 'Reply', workshop: 'Add submission', lesson: 'Open lesson', session: 'Join session', site: 'View' };
    const PURPOSE = { quiz: 'assessment', assign: 'assessment', workshop: 'assessment', forum: 'collaboration', lesson: 'content', session: 'communication', site: 'administration' };
    const KORDER = { urgent: 0, gradesoon: 0, graded: 1, grade: 1, due: 2, late: 3, class: 4, event: 5, done: 6 };
    const OPEN = { urgent: true, graded: true, due: true, late: true, grade: true, gradesoon: true };
    const teach = st.mode === 'teach';
    const filter = st.filter;
    const relMode = st.rel;
    const active = st.pinned !== null ? st.pinned : st.hover;

    const shownOf = (d) => (teach ? d.titems : d.items).filter((it) => (filter === 'all' ? true
      : (filter === 'todo' ? (it.kind !== 'event' && it.kind !== 'class') : it.kind === 'event')));
    const scoreOf = (items) => (relMode ? items.reduce((a, it) => a + it.w, 0) : items.filter((it) => it.kind !== 'done').length);
    const levelOf = (items) => {
      const s = scoreOf(items);
      if (s <= 0) {
        return 0;
      }
      if (!relMode) {
        return Math.min(4, s);
      }
      return s < 2 ? 1 : (s < 4 ? 2 : (s < 8 ? 3 : 4));
    };

    let needle = -1;
    let best = 0;
    for (let i = TODAY; i < D.days.length; i++) {
      const sc = scoreOf(shownOf(D.days[i]));
      if (sc > best) {
        best = sc;
        needle = i;
      }
    }

    const todayVi = TODAY - off;
    const centre = todayVi >= 0 && todayVi < WIN ? todayVi : Math.floor(WIN / 2);
    const C = 2 * Math.PI * 27;

    const days = [];
    for (let vi = 0; vi < WIN; vi++) {
      const i = off + vi;
      const d = D.days[i];
      const items = shownOf(d).slice().sort((a, b) => KORDER[a.kind] - KORDER[b.kind]);
      const cnt = { urgent: 0, graded: 0, due: 0, late: 0, event: 0, done: 0, grade: 0, gradesoon: 0, class: 0 };
      items.forEach((it) => { cnt[it.kind] += 1; });
      const open = cnt.urgent + cnt.graded + cnt.due + cnt.late;
      const lvl = levelOf(items);
      const isToday = i === TODAY;
      const past = i < TODAY;
      const weekend = d.wdn === 0 || d.wdn === 6;
      // An empty weekend or day off is hatched on the disc; one holding items keeps its heat there and
      // carries the hatch under its weekday label (ADR-014 amendment 10).
      const holds = (teach ? d.titems : d.items).length > 0;
      const offday = weekend && !d.dayoff && !holds;
      const holday = !!d.dayoff && !holds;
      const wdCls = 'cc-wd' + (holds && d.dayoff ? ' cc-wd--hol' : (holds && weekend ? ' cc-wd--off' : ''));
      // Graded and to-do counts are an upper bound until the day's items have arrived (amendment 9).
      const upto = st.loaded[i] ? '' : 'up to ';
      let match = '';
      if (st.hc) {
        match = items.some((it) => it.c === st.hc && OPEN[it.kind]) ? ' cc-match' : ' cc-dim';
      }
      const dots = items.slice(0, 4).map((it) => ({ cls: 'cc-dot cc-dot--' + it.kind }));
      const segN = Math.min(items.length, 6);
      const seg = (k) => {
        if (k >= segN) {
          return { cls: 'cc-seg', dash: '0 ' + C, off: '0' };
        }
        const gap = segN > 1 ? 4 : 0;
        const len = C / segN - gap;
        return { cls: 'cc-seg cc-seg--' + items[k].kind, dash: len.toFixed(2) + ' ' + C.toFixed(2), off: (-(k * C) / segN - gap / 2).toFixed(2) };
      };
      const align = vi <= 3 ? 'start' : (vi >= WIN - 4 ? 'end' : 'center');
      const parts = [];
      if (cnt.urgent + cnt.graded) {
        parts.push(upto + (cnt.urgent + cnt.graded) + ' graded');
      }
      if (cnt.due) {
        parts.push(upto + cnt.due + ' to do');
      }
      if (cnt.late) {
        parts.push(cnt.late + ' late, still open');
      }
      if (cnt.event) {
        parts.push(cnt.event + (cnt.event === 1 ? ' event' : ' events'));
      }
      if (cnt.grade + cnt.gradesoon) {
        parts.push((cnt.grade + cnt.gradesoon) + ' to grade');
      }
      if (cnt.class) {
        parts.push(cnt.class + (cnt.class === 1 ? ' class deadline' : ' class deadlines'));
      }
      if (!parts.length) {
        parts.push('nothing open');
      }
      const dayname = WDL[d.wdn] + ', ' + d.num + ' ' + MON[d.month];
      const named = d.dayoff ? dayname + ', ' + d.dayoff.type + ' (' + d.dayoff.note + ')' : (weekend ? dayname + ', weekend' : dayname);
      const label = named + ': ' + parts.join(', ') + (i === needle ? '. ' + (teach ? 'Heaviest grading day ahead' : 'Most relevant day ahead') : '');
      const showPop = active === i;
      const soon = (cnt.urgent + cnt.gradesoon) > 0 && !isToday;
      const cls = ['cc-day', 'cc-h' + lvl, isToday ? 'cc-today' : '', past ? 'cc-past' : '', offday ? 'cc-off' : '', holday ? 'cc-hol' : '', soon ? 'cc-soon' : '', showPop ? 'cc-open' : '', st.pinned === i ? 'cc-pinned' : ''].filter(Boolean).join(' ');
      const day = {
        key: d.key,
        num: d.num,
        wd: WD[d.wdn],
        wdCls: wdCls,
        cls: cls,
        colCls: 'cc-col' + (isToday ? ' cc-col--today' : '') + match + (Math.abs(vi - centre) > 3 ? ' cc-far' : ''),
        label: label,
        needle: i === needle,
        dots: dots,
        hasMore: items.length > 4,
        more: '+' + (items.length - 4),
        s0: seg(0), s1: seg(1), s2: seg(2), s3: seg(3), s4: seg(4), s5: seg(5),
        // The pulse style's danger bar for a day with late work (cc-barover).
        barCls: 'cc-bar cc-h' + lvl + (cnt.late ? ' cc-barover' : ''),
        barH: (items.length ? 10 + Math.min(items.length, 5) * 8 : 4) + 'px',
        showPop: showPop,
        enter: () => this.enterDay(i),
        focus: () => { if (this.state.pinned === null) { clearTimeout(this.openT); this.openDay(i); } },
        click: () => this.clickDay(i),
        pop: null
      };
      if (showPop) {
        const loaded = !!st.loaded[i];
        const chips = [];
        if (cnt.urgent + cnt.graded) {
          chips.push({ dot: 'cc-dot cc-dot--graded', text: (cnt.urgent + cnt.graded) + ' graded' });
        }
        if (cnt.due) {
          chips.push({ dot: 'cc-dot cc-dot--due', text: cnt.due + ' to do' });
        }
        if (cnt.late) {
          chips.push({ dot: 'cc-dot cc-dot--late', text: cnt.late + ' late, still open' });
        }
        if (cnt.event) {
          chips.push({ dot: 'cc-dot cc-dot--event', text: cnt.event + (cnt.event === 1 ? ' event' : ' events') });
        }
        if (cnt.done) {
          chips.push({ dot: 'cc-dot cc-dot--done', text: cnt.done + ' done' });
        }
        if (cnt.grade + cnt.gradesoon) {
          chips.push({ dot: 'cc-dot cc-dot--grade', text: (cnt.grade + cnt.gradesoon) + ' to grade' });
        }
        if (cnt.class) {
          chips.push({ dot: 'cc-dot cc-dot--class', text: cnt.class + (cnt.class === 1 ? ' class deadline' : ' class deadlines') });
        }
        const sorted = items.slice().sort((a, b) => (KORDER[a.kind] - KORDER[b.kind]) || (relMode ? b.w - a.w : 0) || a.time.localeCompare(b.time));
        const list = sorted.map((it) => ({
          rowCls: 'cc-it cc-it--' + it.kind,
          icoCls: 'cc-ico cc-ico--' + PURPOSE[it.m],
          isQuiz: it.m === 'quiz', isAssign: it.m === 'assign', isForum: it.m === 'forum', isWorkshop: it.m === 'workshop',
          isLesson: it.m === 'lesson', isSession: it.m === 'session', isSite: it.m === 'site',
          time: it.time, course: it.course, hue: it.hue, title: it.t,
          isUrgent: it.kind === 'urgent',
          urgentText: i === TODAY ? 'Graded, due today' : 'Graded, due tomorrow',
          isGradedOnly: it.kind === 'graded',
          isLate: it.kind === 'late',
          lateText: 'Late, accepted until ' + it.until,
          isComp: !!it.comp && OPEN[it.kind] === true,
          isFav: it.fav && OPEN[it.kind] === true && it.kind !== 'late',
          isDone: it.kind === 'done',
          isEvent: it.kind === 'event',
          eventText: 'Event',
          isGrade: it.kind === 'grade' || it.kind === 'gradesoon',
          isGradeSoon: it.kind === 'gradesoon',
          gradeSoonText: i === TODAY ? 'Grading due today' : 'Grading due tomorrow',
          waitingText: (it.waiting || 0) + (it.waiting === 1 ? ' submission waiting' : ' submissions waiting'),
          isClass: it.kind === 'class',
          classText: 'Class deadline',
          action: it.kind === 'done' ? 'View' : (it.kind === 'grade' || it.kind === 'gradesoon' ? 'Grade'
            : (it.kind === 'class' ? 'View' : (it.action || ACT[it.m]))),
          actCls: 'cc-act ' + (['urgent', 'graded', 'due', 'grade', 'gradesoon'].indexOf(it.kind) >= 0 ? 'cc-act--primary' : 'cc-act--ghost')
        }));
        const pinned = st.pinned === i;
        day.pop = {
          cls: 'cc-pop cc-pop--' + align + (pinned ? ' cc-pop--pinned' : ''),
          title: WDL[d.wdn] + ', ' + d.num + ' ' + MON[d.month],
          rel: this.rel(i, TODAY),
          relCls: 'cc-rel' + (isToday ? ' cc-rel--today' : ''),
          countText: items.length + (items.length === 1 ? ' item' : ' items'),
          hasOff: !!d.dayoff,
          offText: d.dayoff ? d.dayoff.type + ' · ' + d.dayoff.note : '',
          pinned: pinned,
          close: () => this.closeAll(),
          nOver: cnt.late, nDue: cnt.due + cnt.urgent + cnt.graded + cnt.grade + cnt.gradesoon, nEv: cnt.event + cnt.class, nDone: cnt.done,
          chips: chips,
          loading: !loaded,
          skel: items.slice(0, 3).map((x, k) => ({ w: [72, 58, 66][k] + '%' })),
          isEmpty: loaded && items.length === 0,
          emptyText: filter === 'events' ? 'No events on this day.' : (teach ? 'Nothing to grade, no class deadline.' : 'Nothing open. A free day.'),
          hasItems: loaded && items.length > 0,
          items: list,
          hint: pinned ? 'Pinned. Escape or the close button lets it go.' : 'Click the day to pin this card.'
        };
      }
      days.push(day);
    }

    const first = D.days[off];
    const last = D.days[off + WIN - 1];
    const monthLabel = first.month === last.month
      ? MON[first.month] + ' ' + first.year
      : MON[first.month] + ' – ' + MON[last.month] + ' ' + last.year;

    const activeDay = active !== null ? D.days[active] : null;
    const cards = D.cards.map((c) => {
      let lit = false;
      if (activeDay) {
        lit = shownOf(activeDay).some((it) => it.c === c.c && OPEN[it.kind] === true);
      }
      return Object.assign({}, c, {
        cls: 'cc-card' + (lit ? ' cc-card--lit' : ''),
        starCls: 'cc-star' + (c.fav ? '' : ' cc-star--off'),
        starFill: c.fav ? 'currentColor' : 'none',
        starLabel: c.fav ? 'Remove ' + c.title + ' from starred' : 'Star ' + c.title,
        pctW: c.pct + '%',
        enter: () => this.setState({ hc: c.c }),
        leave: () => this.setState({ hc: null }),
        openDay: () => {
          const target = c.day;
          const b = this.bounds();
          const o = Math.max(b.min, Math.min(b.max, target - Math.floor(this.win() / 2)));
          this.setState({ off: o, pinned: target, hover: target });
          this.touch(target);
        }
      });
    });

    const byId = {};
    cards.forEach((c) => { byId[c.c] = c; });
    const tiers = [
      { title: 'Continue where you left off', cards: [byId.ds, byId.oc, byId.ee], ghost: false },
      { title: 'My favourites', cards: [byId.ds], ghost: true }
    ];
    const skelDays = [];
    for (let k = 0; k < WIN; k++) {
      skelDays.push({ k: k });
    }
    const requests = st.log.filter((e) => e.tag !== 'cache' && e.tag !== 'local').length;
    const log = st.log.map((e) => ({ tagCls: 'cc-tag cc-tag--' + e.tag, tag: e.tag === 'idle' ? 'idle: today' : e.tag, name: e.name, detail: e.detail, ms: e.ms, kb: e.kb }));

    return {
      themeCls: (this.props.dark ?? false) ? 'cc-dark' : '',
      stripStyle: this.props.stripStyle ?? 'dots',
      showNet: this.props.showNetwork ?? true,
      daysCls: 'cc-days cc-days--' + WIN,
      daysLabel: 'Days, ' + WIN + ' shown',
      needleTitle: teach ? 'Heaviest grading day ahead' : 'Most relevant day ahead',
      holInView: D.days.slice(off, off + WIN).some((x) => !!x.dayoff),
      monthLabel: monthLabel,
      hasBoth: true,
      mStudy: !teach,
      mTeach: teach,
      setStudy: () => this.switchMode('study'),
      setTeach: () => this.switchMode('teach'),
      fAll: filter === 'all',
      fTodo: filter === 'todo',
      fEvents: filter === 'events',
      setAll: () => this.setState({ filter: 'all' }),
      setTodo: () => this.setState({ filter: 'todo' }),
      setEvents: () => this.setState({ filter: 'events' }),
      rel: relMode,
      toggleRel: () => this.setState({ rel: !this.state.rel }),
      atStart: off <= bnd.min,
      atEnd: off >= bnd.max,
      prevWeek: () => this.shift(this.curOff() - 7),
      nextWeek: () => this.shift(this.curOff() + 7),
      goToday: () => this.shift(this.bounds().min),
      days: days,
      trackOn: todayVi >= 0 && todayVi < WIN,
      trackLeft: ((todayVi / WIN) * 100).toFixed(3) + '%',
      trackW: (100 / WIN).toFixed(3) + '%',
      enterWrap: () => clearTimeout(this.closeT),
      leaveWrap: () => {
        clearTimeout(this.openT);
        if (this.state.pinned !== null) {
          return;
        }
        this.closeT = this.later(() => this.setState({ hover: null }), 200);
      },
      keyWrap: (e) => {
        if (e.key === 'Escape') {
          this.closeAll();
        }
      },
      blurWrap: (e) => {
        if (this.state.pinned !== null) {
          return;
        }
        if (!e.relatedTarget || !e.currentTarget.contains(e.relatedTarget)) {
          this.setState({ hover: null });
        }
      },
      costText: 'Today to the end of next month, from one request; past days only to fill the row. A wider range is the calendar’s job.',
      tiers: tiers,
      cardsReady: st.cardsReady,
      cardsWaiting: !st.cardsReady,
      stripReady: st.stripReady,
      stripWaiting: !st.stripReady,
      skelDays: skelDays,
      log: log,
      simulateReturn: () => {
        this.closeAll();
        this.setState({ loaded: {}, loading: {}, meta: {}, off: null, cardsReady: false, stripReady: false });
        this.boot(true);
      },
      netSummary: requests + (requests === 1 ? ' request' : ' requests') + ' that reached the database · one per day pointed at, then never again'
    };
  }
}

        <button type="button" class="cc-iconbtn" aria-label="Reload Compass">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>

      <div class="cc-bbody">
        <div class="cc-strip" onMouseEnter=${v.enterWrap} onMouseLeave=${v.leaveWrap} onKeyDown=${v.keyWrap} onBlur=${v.blurWrap}>
          <div class="cc-shead">

              <button type="button" class="cc-iconbtn" aria-label="Earlier days" data-core-icon="i/previous" disabled=${v.atStart} onClick=${v.prevWeek}>
                <svg width="16" height="16" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path d="M41.4 233.4a32 32 0 0 0 0 45.3l160 160a32 32 0 0 0 45.3-45.3L109.3 256l137.4-137.4a32 32 0 0 0-45.3-45.3l-160 160z"></path></svg>
