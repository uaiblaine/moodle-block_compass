<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass strip on a phone</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.mb{
  --cc-page:#f4f5f7;--cc-surface:#fff;--cc-surface-2:#f6f7f9;--cc-text:#1d2125;--cc-text-2:#454c53;--cc-muted:#68717a;
  --cc-line:#e4e7eb;--cc-line-2:#d5dade;--cc-accent:#0f6cbf;--cc-on-accent:#fff;--cc-danger:#ca3120;--cc-warn:#f0ad4e;--cc-ink:#121518;--cc-on-ink:#fff;--cc-hatch:#d4d9de;
  --cc-h1:color-mix(in oklab,var(--cc-warn) 17%,var(--cc-surface));
  --cc-h2:color-mix(in oklab,var(--cc-warn) 36%,var(--cc-surface));
  --cc-h3:color-mix(in oklab,var(--cc-warn) 62%,var(--cc-surface));
  --cc-h4:color-mix(in oklab,var(--cc-warn) 92%,var(--cc-surface));
  --activityassessment:#f90086;--activitycollaboration:#5b40ff;--activitycommunication:#eb6200;
  font-family:'Noto Sans',system-ui,sans-serif;color:var(--cc-text);background:var(--cc-page);font-variant-numeric:tabular-nums;
}
.mb *{box-sizing:border-box}
.day{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;border:0;background:transparent;color:var(--cc-text);font-family:inherit}
.h1{background:var(--cc-h1)}.h2{background:var(--cc-h2)}.h3{background:var(--cc-h3)}.h4{background:var(--cc-h4)}
.off{background:repeating-linear-gradient(135deg,var(--cc-hatch) 0 1px,transparent 1px 6px);color:var(--cc-muted)}
.today{background:var(--cc-ink);color:var(--cc-on-ink)}
.today.halo{box-shadow:0 0 0 2.5px var(--cc-surface),0 0 0 4.5px var(--cc-h3)}
.sel{outline:2px solid var(--cc-accent);outline-offset:3px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 1 0;min-width:0}
.dots{display:flex;gap:3px;height:8px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%}
.due{background:var(--cc-accent)}
.event{width:7px;height:7px;border:1.5px solid var(--cc-text-2)}
.graded,.urgent{background:var(--cc-accent);border-radius:1.5px;width:7px;height:7px}
.urgent{box-shadow:0 0 0 2px var(--cc-surface),0 0 0 3.5px var(--cc-accent)}
.soon{box-shadow:0 0 0 2px var(--cc-surface),0 0 0 4px var(--cc-accent)}
.wd{font-size:11.5px;color:var(--cc-muted)}
.needle{width:9px;height:7px;background:var(--cc-accent);clip-path:polygon(0 0,100% 0,50% 100%)}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--p);background:color-mix(in oklab,var(--p) 13%,var(--cc-surface));flex:none}
.p-assess{--p:var(--activityassessment)}.p-comm{--p:var(--activitycommunication)}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--cc-surface-2);color:var(--cc-text-2);border:1px solid var(--cc-line)}
.act{font-size:12.5px;font-weight:600;text-decoration:none;border-radius:9px;padding:9px 11px;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center}
.primary{background:var(--cc-accent);color:var(--cc-on-accent)}
.ghost{border:1px solid var(--cc-line-2);color:var(--cc-text-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--cc-text-2);background:var(--cc-surface-2);border:1px solid var(--cc-line);border-radius:20px;padding:2px 9px}
</style>

<style>
.dcx-tweaks{position:fixed;right:16px;bottom:16px;z-index:9999;background:#fff;color:#1d2125;border:1px solid #d5dade;
  border-radius:12px;padding:10px 12px;font:13px system-ui,sans-serif;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:6px;min-width:190px}
.dcx-tweaks b{font-weight:600}
.dcx-tweaks label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dcx-tweaks a{color:#0f6cbf}
</style>
</head>
<body>
<div id="dcx-root"></div>
<script type="module">
import { h, render, Component as PreactComponent } from 'https://cdn.jsdelivr.net/npm/preact@10.24.3/dist/preact.module.js';
import htm from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js';
const html = htm.bind(h);
class DCLogic extends PreactComponent {}

class Component extends DCLogic {
  renderVals() {
    const d = (n, wd, cls, dots, label, needle) => ({ n: n, wd: wd, cls: 'day ' + cls, dots: dots.map((k) => 'dot ' + k), label: label, needle: !!needle });
    const week = [
      d(12, 'Mon', 'past', [], 'Monday 12 October: nothing open'),
      d(13, 'Tue', 'today halo', ['urgent', 'due', 'event'], 'Today, Tuesday 13 October: 1 graded, 1 to do, 1 event'),
      d(14, 'Wed', 'h3 soon', ['urgent'], 'Wednesday 14 October: 1 graded, due tomorrow'),
      d(15, 'Thu', 'h4 sel', ['graded', 'graded', 'graded', 'event'], 'Thursday 15 October: 3 graded, 1 event, open'),
      d(16, 'Fri', 'h2', ['graded', 'due'], 'Friday 16 October: 1 graded, 1 to do'),
      d(17, 'Sat', 'off', [], 'Saturday 17 October: nothing'),
      d(18, 'Sun', 'h1', ['event'], 'Sunday 18 October: 1 event')
    ];
    week[0].cls = 'day';
    const FILE = 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4';
    const QUIZ = 'M7.5 4h9A3.5 3.5 0 0 1 20 7.5v9a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 16.5v-9A3.5 3.5 0 0 1 7.5 4zM8.5 12.5l2.5 2.5 4.5-5';
    const PEOPLE = 'M9 4.8a3.2 3.2 0 1 1 0 6.4 3.2 3.2 0 0 1 0-6.4zM3.5 19a5.5 5.5 0 0 1 11 0M17 7a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM15.8 14.3A4.5 4.5 0 0 1 21 18.6';
    const VIDEO = 'M5.5 6h8A2.5 2.5 0 0 1 16 8.5v7a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 3 15.5v-7A2.5 2.5 0 0 1 5.5 6zM16 10.5l5-3v9l-5-3';
    const items = [
      { p: 'ico p-assess', icon: FILE, time: '23:59', course: 'Data Structures', title: 'Project milestone 2', hasBadge: true, badge: 'Counts toward completion', action: 'Add submission', actCls: 'act primary' },
      { p: 'ico p-assess', icon: PEOPLE, time: '20:00', course: 'Ethics in Engineering', title: 'Submit the case study', hasBadge: true, badge: 'Counts toward completion', action: 'Add submission', actCls: 'act primary' },
      { p: 'ico p-assess', icon: QUIZ, time: '08:00', course: 'Organic Chemistry II', title: 'Pre-lab quiz 4', hasBadge: true, badge: 'Graded', action: 'Attempt quiz now', actCls: 'act primary' },
      { p: 'ico p-comm', icon: VIDEO, time: '10:00', course: 'Linear Algebra', title: 'Tutorial, group B', hasBadge: true, badge: 'Course event', action: 'Join session', actCls: 'act ghost' }
    ];
    return { week: week, items: items };
  }
}

Component.prototype.render = function () {
  const v = this.renderVals();
  return html`
<div class="mb" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="height: 56px; background: var(--cc-surface); border-bottom: 1px solid var(--cc-line); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex: none">
    <button type="button" aria-label="Open the menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; margin-left: -10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <span style="font-weight: 700; font-size: 16px">Dashboard</span>
    <span style="width: 32px; height: 32px; border-radius: 50%; background: var(--cc-surface-2); border: 1px solid var(--cc-line); display: grid; place-items: center; font-size: 12px; font-weight: 600">LM</span>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1 1 auto">
    <section style="background: var(--cc-surface); border: 1px solid var(--cc-line); border-radius: 14px; padding: 14px 12px 16px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 2px 10px">
        <button type="button" aria-label="Earlier days" disabled=${v.yes} style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--cc-line); background: var(--cc-surface); display: grid; place-items: center; opacity: .4">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <span style="font-size: 17px; font-weight: 600">October 2026</span>
        <button type="button" aria-label="Later days" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--cc-line); background: var(--cc-surface); display: grid; place-items: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
      <div role="group" aria-label="Show the strip for" style="display: flex; background: var(--cc-surface-2); border: 1px solid var(--cc-line); border-radius: 10px; padding: 3px; margin: 0 2px 10px">
        <button type="button" aria-pressed="true" style="flex: 1 1 0; min-height: 40px; border: 0; border-radius: 8px; background: var(--cc-surface); font: inherit; font-size: 13.5px; font-weight: 600; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.12)">Studying</button>
        <button type="button" aria-pressed="false" style="flex: 1 1 0; min-height: 40px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 13.5px; color: var(--cc-text-2)">Teaching</button>
      </div>
      <div style="display: flex; padding-top: 4px">
        ${(v.week || []).map((d, __i0) => html`
          <div class="col">
            <span style="height: 7px">${(d.needle) ? html`<span class="needle" style="display: block"></span>` : null}</span>
            <button type="button" class=${d.cls} aria-label=${d.label}>${d.n}</button>
            <span class="dots">${(d.dots || []).map((x, __i1) => html`<span class=${x}></span>`)}</span>
            <span class="wd">${d.wd}</span>
          </div>
        `)}
      </div>
    </section>

    <section style="background: var(--cc-surface); border: 1px solid var(--cc-line); border-radius: 14px; overflow: hidden">
      <div style="height: 96px; background: #dbe6f2"></div>
      <div style="padding: 12px 14px">
        <div style="font-size: 12px; color: var(--cc-muted)">Computer Science · Semester 2</div>
        <div style="font-weight: 600; font-size: 15px">Data Structures</div>
      </div>
    </section>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15, 18, 22, 0.38)"></div>

  <section role="dialog" aria-label="Thursday, 15 October" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--cc-surface); border-radius: 22px 22px 0 0; box-shadow: 0 -18px 40px -16px rgba(0, 0, 0, 0.35); padding: 8px 0 24px; max-height: 560px">
    <span aria-hidden="true" style="display: block; width: 40px; height: 5px; border-radius: 5px; background: var(--cc-line-2); margin: 0 auto 10px"></span>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; padding: 4px 18px 10px">
      <div>
        <p style="margin: 0; font-size: 17px; font-weight: 600">Thursday, 15 October</p>
        <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 12.5px; color: var(--cc-muted)">
          <span style="padding: 1px 8px; border-radius: 20px; background: var(--cc-surface-2); border: 1px solid var(--cc-line); font-weight: 600; color: var(--cc-text-2)">In 2 days</span>
          <span>4 items</span>
          <span>Prefetched, no wait</span>
        </div>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; color: var(--cc-muted); margin: -6px -10px 0 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 3px; height: 6px; margin: 0 18px">
      <span style="flex-grow: 3; background: var(--cc-accent); border-radius: 6px"></span>
      <span style="flex-grow: 1; background: var(--cc-text-2); opacity: .55; border-radius: 6px"></span>
    </div>
    <div style="display: flex; gap: 6px; padding: 10px 18px 4px">
      <span class="chip"><span class="dot graded"></span>3 graded</span>
      <span class="chip"><span class="dot event"></span>1 event</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 4px 8px 0">
      ${(v.items || []).map((it, __i0) => html`
        <li style="display: flex; gap: 12px; align-items: center; padding: 10px">
          <span class=${it.p} aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d=${it.icon}></path></svg>
          </span>
          <div style="min-width: 0; flex: 1 1 auto">
            <div style="font-size: 12px; color: var(--cc-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">${it.time} · ${it.course}</div>
            <a href="#" style="display: block; color: var(--cc-text); font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">${it.title}</a>
            ${(it.hasBadge) ? html`<span class="badge" style="display: inline-block; margin-top: 4px">${it.badge}</span>` : null}
          </div>
          <a href="#" class=${it.actCls}>${it.action}</a>
        </li>
      `)}
    </ul>
    <div style="display: flex; justify-content: center; padding: 12px 18px 0; border-top: 1px solid var(--cc-line); margin-top: 8px">
      <a href="#" style="font-size: 13.5px; font-weight: 600; color: var(--cc-accent); text-decoration: none; padding: 8px">Open this day in the calendar</a>
    </div>
  </section>
</div>
`;
};
const TWEAKS = {};
class Shell extends PreactComponent {
  constructor(props) { super(props); this.state = {}; }
  render() {
    const rows = Object.entries(TWEAKS).map(([key, t]) => {
      const set = (value) => this.setState({ [key]: value });
      if (t.editor === 'boolean') {
        return html`<label>${key} <input type="checkbox" checked=${!!this.state[key]} onChange=${(e) => set(e.target.checked)} /></label>`;
      }
      if (t.editor === 'enum') {
        return html`<label>${key} <select value=${this.state[key]} onChange=${(e) => set(e.target.value)}>
          ${t.options.map((o) => html`<option value=${o}>${o}</option>`)}</select></label>`;
      }
      if (t.editor === 'range' || t.editor === 'int') {
        return html`<label>${key} <input type="number" min=${t.min} max=${t.max} step=${t.step || 1} value=${this.state[key]}
          onChange=${(e) => set(Number(e.target.value))} style="width: 80px" /></label>`;
      }
      return null;
    });
    return html`<${Component} ...${this.state} />${rows.length ? html`<aside class="dcx-tweaks" aria-label="Mockup tweaks">
      <b>Tweaks</b>${rows}<a href="index.html">All artboards</a></aside>` : html`<aside class="dcx-tweaks"><a href="index.html">All artboards</a></aside>`}`;
  }
}
render(html`<${Shell} />`, document.getElementById('dcx-root'));
</script>
</body>
</html>
