<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass calendar settings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.st{--line:#e4e7eb;--muted:#68717a;--text:#1d2125;--text-2:#454c53;--accent:#0f6cbf;font-family:'Noto Sans',system-ui,sans-serif;color:var(--text);background:#fff}
.st *{box-sizing:border-box}
.row{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;padding:16px 0;border-bottom:1px solid var(--line)}
.lab{font-weight:600;font-size:14.5px}
.key{font-size:12px;color:var(--muted);margin-top:2px}
.desc{font-size:13px;color:var(--text-2);margin-top:6px;line-height:1.5}
.def{font-size:12px;color:var(--muted);margin-top:4px}
.sel{height:38px;border:1px solid #c9ced3;border-radius:8px;padding:0 34px 0 12px;font:inherit;font-size:14px;background:#fff;color:var(--text)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;min-height:28px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
</style>

<style>
.dcx-tweaks{position:fixed;right:16px;bottom:16px;z-index:9999;background:#fff;color:#1d2125;border:1px solid #d5dade;
  border-radius:12px;padding:10px 12px;font:13px system-ui,sans-serif;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:6px;min-width:190px}
.dcx-tweaks b{font-weight:600}
.dcx-tweaks label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dcx-tweaks a{color:#0f6cbf}
</style>
</head>
<body>
<div id="dcx-root"></div>
<script type="module">
import { h, render, Component as PreactComponent } from 'https://cdn.jsdelivr.net/npm/preact@10.24.3/dist/preact.module.js';
import htm from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js';
const html = htm.bind(h);
class DCLogic extends PreactComponent {}

class Component extends DCLogic {
  renderVals() {
    return { yes: true };
  }
}

Component.prototype.render = function () {
  const v = this.renderVals();
  return html`
<div class="st" style="width: 880px; min-height: 1000px; padding: 36px 44px">
  <div style="font-size: 13px; color: var(--muted)">Site administration / Plugins / Blocks / Compass</div>
  <h1 style="margin: 8px 0 4px; font-size: 26px; font-weight: 600">Compass</h1>
  <h2 style="margin: 22px 0 0; font-size: 18px; font-weight: 600">Calendar strip</h2>
  <p style="margin: 6px 0 4px; font-size: 13.5px; color: var(--text-2)">A row of days above the first tier, from a few days ago to the end of next month, weighed by what each day holds. Pointing at a day lists its items with the actions the Timeline offers.</p>

  <div class="row">
    <div><div class="lab"><label for="s-en">Show the calendar strip</label></div><div class="key">block_compass | calendar_enabled</div></div>
    <div>
      <label class="chk"><input id="s-en" type="checkbox" checked=${v.yes} readOnly=${v.yes} />Default: No</label>
      <div class="desc">When off, the strip costs nothing: no request, no query.</div>
    </div>
  </div>

  <div class="row">
    <div><div class="lab"><label for="s-where">Where the strip shows</label></div><div class="key">block_compass | calendar_where</div></div>
    <div>
      <select id="s-where" class="sel"><option selected=${v.yes}>Dashboard and the Compass page</option><option>Dashboard only</option><option>Compass page only</option></select>
      <div class="def">Default: Dashboard and the Compass page</div>
      <div class="desc">The surfaces that show the calendar strip.</div>
    </div>
  </div>

  <div class="row">
    <div><div class="lab">Calendar sources</div><div class="key">block_compass | calendar_sources</div></div>
    <div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <label class="chk"><input type="checkbox" checked=${v.yes} readOnly=${v.yes} />Deadlines and grading work</label>
        <label class="chk"><input type="checkbox" checked=${v.yes} readOnly=${v.yes} />Course events, and the events of its activities</label>
        <label class="chk"><input type="checkbox" checked=${v.yes} readOnly=${v.yes} />Group events</label>
        <label class="chk"><input type="checkbox" checked=${v.yes} readOnly=${v.yes} />Site events</label>
        <label class="chk"><input type="checkbox" readOnly=${v.yes} />Personal events</label>
        <label class="chk"><input type="checkbox" readOnly=${v.yes} />Category events</label>
      </div>
      <div class="def">Default: Deadlines and grading work, Course events, and the events of its activities, Group events, Site events</div>
      <div class="desc">What the strip counts and a day lists. Deadlines are the activities with something to do, and for a teacher the submissions waiting to be graded.</div>
    </div>
  </div>

  <div class="row">
    <div><div class="lab"><label for="s-style">Strip style</label></div><div class="key">block_compass | calendar_style</div></div>
    <div>
      <select id="s-style" class="sel"><option selected=${v.yes}>Dots</option><option>Ring</option><option>Pulse bars</option></select>
      <div class="def">Default: Dots</div>
      <div class="desc">How each day is drawn. The ring needs more room per day, so it shows fewer days at once.</div>
    </div>
  </div>

  <div class="row">
    <div><div class="lab"><label for="s-rel">Weigh days by relevance</label></div><div class="key">block_compass | calendar_relevance</div></div>
    <div>
      <label class="chk"><input id="s-rel" type="checkbox" checked=${v.yes} readOnly=${v.yes} />Default: Yes</label>
      <div class="desc">The starting value of each user's own switch. On, graded work, starred courses and work due today or tomorrow weigh more; off, a day's colour follows only how many items it holds.</div>
    </div>
  </div>

  <div class="row" style="border-bottom: 0; background: #f6f7f9; border-radius: 10px; padding: 14px 16px; margin-top: 14px">
    <div><div class="lab">Weekends, holidays and recesses</div><div class="key">no setting of its own (ADR-014 amendment 10)</div></div>
    <div>
      <div class="desc" style="margin-top: 0">Without block_feedback_tracker, the weekend is core's <b>calendar_weekend</b> (Site administration / Appearance / Calendar), Saturday and Sunday when never saved. With block_feedback_tracker installed, its academic calendar is the truth: its weekend mask and its holidays, recesses and closed days, read in one statement when the strip is built. Never both.</div>
    </div>
  </div>

  <button type="button" style="margin-top: 18px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-size: 14px; font-weight: 600">Save changes</button>
</div>
`;
};
const TWEAKS = {};
class Shell extends PreactComponent {
  constructor(props) { super(props); this.state = {}; }
  render() {
    const rows = Object.entries(TWEAKS).map(([key, t]) => {
      const set = (value) => this.setState({ [key]: value });
      if (t.editor === 'boolean') {
        return html`<label>${key} <input type="checkbox" checked=${!!this.state[key]} onChange=${(e) => set(e.target.checked)} /></label>`;
      }
      if (t.editor === 'enum') {
        return html`<label>${key} <select value=${this.state[key]} onChange=${(e) => set(e.target.value)}>
          ${t.options.map((o) => html`<option value=${o}>${o}</option>`)}</select></label>`;
      }
      if (t.editor === 'range' || t.editor === 'int') {
        return html`<label>${key} <input type="number" min=${t.min} max=${t.max} step=${t.step || 1} value=${this.state[key]}
          onChange=${(e) => set(Number(e.target.value))} style="width: 80px" /></label>`;
      }
      return null;
    });
    return html`<${Component} ...${this.state} />${rows.length ? html`<aside class="dcx-tweaks" aria-label="Mockup tweaks">
      <b>Tweaks</b>${rows}<a href="index.html">All artboards</a></aside>` : html`<aside class="dcx-tweaks"><a href="index.html">All artboards</a></aside>`}`;
  }
}
render(html`<${Shell} />`, document.getElementById('dcx-root'));
</script>
</body>
</html>
