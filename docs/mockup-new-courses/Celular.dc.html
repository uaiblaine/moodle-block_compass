<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Compass: open courses on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.cc-root{
  --cc-page:#f4f5f7;--cc-surface:#fff;--cc-surface-2:#f6f7f9;--cc-text:#1d2125;--cc-text-2:#454c53;--cc-muted:#5f6870;
  --cc-line:#e4e7eb;--cc-line-2:#d5dade;--cc-accent:#0f6cbf;--cc-new-bg:#e7f0fa;--cc-new-fg:#0b4f8c;--cc-ink:#121518;--cc-on-ink:#fff;
  --cc-warn:#f0ad4e;--cc-h1:color-mix(in oklab,var(--cc-warn) 17%,var(--cc-surface));--cc-h2:color-mix(in oklab,var(--cc-warn) 36%,var(--cc-surface));
  --cc-shadow:0 -10px 30px -12px rgba(16,24,40,.3);
  font-family:'Noto Sans',system-ui,sans-serif;background:var(--cc-page);color:var(--cc-text);font-variant-numeric:tabular-nums;font-size:15px;line-height:1.45;
}
.cc-root.cc-dark{
  --cc-page:#0f1113;--cc-surface:#1a1d20;--cc-surface-2:#22262a;--cc-text:#eceef0;--cc-text-2:#c4c9ce;--cc-muted:#9aa2aa;
  --cc-line:#2c3135;--cc-line-2:#3a4045;--cc-accent:#7fb4e8;--cc-new-bg:#13263a;--cc-new-fg:#a9d0f5;--cc-ink:#f3f4f6;--cc-on-ink:#111417;--cc-warn:#f2b45c;
  --cc-shadow:0 -10px 30px -12px rgba(0,0,0,.7);
}
.cc-root *{box-sizing:border-box}
.kicker{font-size:12.5px;font-weight:600;color:var(--cc-accent);margin:0}
.phones{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.fr{display:flex;flex-direction:column;gap:8px;width:390px}
.fr-cap{margin:0;font-size:13px;color:var(--cc-text-2)}
.fr-cap b{color:var(--cc-text)}
.ph{position:relative;width:390px;height:720px;border:1px solid var(--cc-line);border-radius:28px;overflow:hidden;background:var(--cc-page);padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.blk{border:1px solid var(--cc-line);border-radius:12px;background:var(--cc-surface);padding:12px;display:flex;flex-direction:column;gap:10px}
.bt{margin:0;font-size:17px;font-weight:600}
.sl{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--cc-line);padding-bottom:8px}
.sl-t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.sl-nothing{margin:0;font-size:13px;color:var(--cc-muted)}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--cc-text-2)}
.chip{min-width:30px;height:26px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:14px}
.c-t{background:var(--cc-ink);color:var(--cc-on-ink)}.c-1{background:var(--cc-h1)}.c-2{background:var(--cc-h2)}
.nv{display:flex;flex-direction:column;gap:8px}
.nv-top{display:flex;align-items:center;gap:8px}
.nv-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--cc-new-bg);color:var(--cc-new-fg);flex:none}
.nv-h{margin:0;font-size:14px;font-weight:700}
.x{margin-left:auto;width:40px;height:40px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;color:var(--cc-muted)}
.nv-sum{margin:0;font-size:13px;color:var(--cc-text-2)}
.gs{display:flex;gap:6px;overflow:hidden;flex-wrap:wrap}
.g{text-decoration:none;color:var(--cc-text);display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 6px 0 12px;border:1px solid var(--cc-line-2);border-radius:999px;font-size:13.5px;background:var(--cc-surface);max-width:100%}
.g span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--cc-new-bg);color:var(--cc-new-fg);font-size:12.5px;font-weight:700}
.quiet{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cc-muted)}
.quiet a{color:var(--cc-accent)}
.cards{display:flex;flex-direction:column;gap:10px}
.cd{border:1px solid var(--cc-line);border-radius:12px;display:grid;grid-template-columns:72px 1fr;overflow:hidden}
.cd-i{background:color-mix(in oklab,#0f6cbf 18%,var(--cc-surface))}
.cd-b{padding:8px 10px;font-size:13.5px;font-weight:600}
.cd-b small{display:block;font-weight:400;color:var(--cc-muted);font-size:12px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cc-surface);border-top-left-radius:18px;border-top-right-radius:18px;box-shadow:var(--cc-shadow);padding:10px 16px 18px;display:flex;flex-direction:column;gap:4px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--cc-line-2);align-self:center;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-height:52px;border-bottom:1px solid var(--cc-line);font-size:14.5px}
.row small{display:block;font-size:12.5px;color:var(--cc-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.foot{display:flex;justify-content:space-between;padding-top:10px;font-size:13.5px;color:var(--cc-accent)}
.scrim{position:absolute;inset:0;background:rgba(16,24,40,.35)}
.tiles{display:flex;flex-direction:column;gap:8px}
.tile{text-decoration:none;color:var(--cc-text);border:1px solid var(--cc-line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile-t{display:flex;justify-content:space-between;font-weight:600}
.tile small{color:var(--cc-muted);font-size:12.5px}
</style>
</helmet>
<div class="cc-root {{darkClass}}" style="min-height: 900px; padding: 32px 36px; display: flex; flex-direction: column; gap: 16px;">
  <header>
    <p class="kicker">block_compass · open courses to join · option B at 390 px</p>
    <h1 style="margin: 4px 0 0; font-size: 24px; font-weight: 700;">On a phone: the line wraps under its title, the list is a bottom sheet</h1>
  </header>
  <div class="phones">
    <figure class="fr" style="margin: 0;">
      <p class="fr-cap"><b>Calm.</b> The title row keeps the ×; the groups wrap below; three at most, then "+N".</p>
      <div class="ph">
        <div class="blk">
          <p class="bt">Meus cursos</p>
          <div class="sl"><span class="sl-t">› Calendário</span><p class="sl-nothing">Nada a fazer ou assistir até o fim de novembro</p></div>
          <section class="nv" aria-labelledby="ph1">
            <div class="nv-top">
              <span class="nv-ic" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg></span>
              <h3 class="nv-h" id="ph1">Inscrições abertas</h3>
              <button class="x" type="button" aria-label="Ocultar até o próximo acesso"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <p class="nv-sum">6 cursos começam até 27 de novembro</p>
            <div class="gs"><a class="g" href="#"><span>Saúde</span><span class="n">3</span></a><a class="g" href="#"><span>Tecnologia</span><span class="n">2</span></a><a class="g" href="#"><span>Gestão Pública · Licitações e Contratos</span></a></div>
          </section>
          <p style="margin: 2px 0 0; font-weight: 600;">Continuar de onde parou</p>
          <div class="cards"><div class="cd"><div class="cd-i"></div><div class="cd-b">Ética Profissional<small>Formação geral</small></div></div><div class="cd"><div class="cd-i"></div><div class="cd-b">Gestão de Crises<small>Operações</small></div></div></div>
        </div>
      </div>
    </figure>

    <figure class="fr" style="margin: 0;">
      <p class="fr-cap"><b>Busy.</b> One muted line; "Ver" opens the bottom sheet (focus moves into it, Esc and the scrim close it, focus returns to "Ver").</p>
      <div class="ph">
        <div class="blk">
          <p class="bt">Meus cursos</p>
          <div class="sl"><span class="sl-t">› Calendário</span>
            <div class="cells"><span class="cell">Atrasadas<span class="chip">0</span></span><span class="cell"><b>Hoje</b><span class="chip c-t">2</span></span><span class="cell">Amanhã<span class="chip c-1">1</span></span><span class="cell">Semana<span class="chip c-2">4</span></span><span class="cell">Depois<span class="chip c-1">7</span></span></div>
          </div>
          <div class="quiet"><span class="nv-ic" style="width: 22px; height: 22px;" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg></span>6 cursos com inscrição aberta começam até 27/11 · <a href="#">Ver</a></div>
          <p style="margin: 2px 0 0; font-weight: 600;">Continuar de onde parou</p>
          <div class="cards"><div class="cd"><div class="cd-i"></div><div class="cd-b">Ética Profissional<small>Formação geral</small></div></div></div>
        </div>
        <div class="scrim"></div>
        <div class="sheet" role="dialog" aria-label="Inscrições abertas">
          <span class="grab"></span>
          <p style="margin: 0 0 4px; font-weight: 700;">Começam entre 21 de outubro e 27 de novembro</p>
          <div class="row"><span>Saúde<small>Primeiros Socorros, Biossegurança e mais 1</small></span><span class="n">3</span></div>
          <div class="row"><span>Tecnologia<small>Python para Análise de Dados, LGPD na Prática</small></span><span class="n">2</span></div>
          <div class="row"><span>Gestão Pública<small>Licitações e Contratos</small></span><span class="n">1</span></div>
          <div class="foot"><span>Ver todos os cursos abertos</span><span>Ocultar até o próximo acesso</span></div>
        </div>
      </div>
    </figure>

    <figure class="fr" style="margin: 0;">
      <p class="fr-cap"><b>No course yet.</b> The empty state is the offer: one tile per group, then the way to everything open.</p>
      <div class="ph">
        <div class="blk">
          <p class="bt">Meus cursos</p>
          <div class="sl"><span class="sl-t">› Calendário</span><p class="sl-nothing">Nada a fazer ou assistir até o fim de novembro</p></div>
          <p style="margin: 0; color: var(--cc-text-2);">Você ainda não está inscrito em nenhum curso.</p>
          <p class="nv-h">Com inscrição aberta para você, começando até 27 de novembro</p>
          <div class="tiles">
            <a class="tile" href="#"><span class="tile-t">Saúde <span class="n">3</span></span><small>Primeiros Socorros, Biossegurança e mais 1</small></a>
            <a class="tile" href="#"><span class="tile-t">Tecnologia <span class="n">2</span></span><small>Python para Análise de Dados, LGPD na Prática</small></a>
            <a class="tile" href="#"><span class="tile-t">Gestão Pública <span class="n">1</span></span><small>Licitações e Contratos</small></a>
          </div>
          <a href="#" style="font-size: 13.5px; color: var(--cc-accent);">Ver todos os cursos abertos</a>
        </div>
      </div>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1300,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {darkClass: this.props.dark ? 'cc-dark' : ''};
  }
}
</script>
</body>
</html>
