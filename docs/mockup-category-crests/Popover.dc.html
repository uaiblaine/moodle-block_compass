<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Popover das categorias</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#1d2125}
a{color:#1f3a7a}a:hover{color:#152a5c}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:10px;color:#1d2125;text-decoration:none}
.row:hover{background:#eef2f9;color:#1d2125;text-decoration:none}
.row:focus-visible{outline:2px solid #1f3a7a;outline-offset:1px}
.slot{display:grid;flex:none;place-items:center;width:34px;height:36px;border-radius:8px;background:#f4f6fa}
.slot.slot-empty{background:transparent}
.pname{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.pcat{display:-webkit-box;overflow:hidden;font-size:14px;font-weight:600;line-height:1.35;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.psub{overflow:hidden;color:#5b6470;font-size:12.5px;text-overflow:ellipsis;white-space:nowrap}
.count{display:inline-grid;flex:none;place-items:center;min-width:26px;height:26px;box-sizing:border-box;padding:0 7px;border-radius:13px;background:#e3e9f5;color:#1f3a6e;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:700}
</style>
</helmet>
<div style="width: 520px; height: 640px; box-sizing: border-box; padding: 36px 40px; background: #eef0f4; display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
<button type="button" aria-haspopup="dialog" aria-expanded="true" style="min-height: 40px; padding: 0 14px; border: 1px solid #1f3a7a; border-radius: 999px; background: #ffffff; color: #1f3a6e; font: inherit; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums">+2</button>
<div role="dialog" aria-label="Inscrições abertas" style="width: 420px; box-sizing: border-box; padding: 16px 14px 14px; border: 1px solid #e3e7ee; border-radius: 16px; background: linear-gradient(135deg, #fdfbf7 0%, #ffffff 60%, #e8edf7 100%); box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 18px 40px -10px rgba(16,24,40,.28); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 6px">
<span aria-hidden="true" style="display: inline-grid; flex: none; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: #e8edf7; box-shadow: inset 0 0 0 1px rgba(31,58,122,.14); color: #1f3a6e">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4.5" width="18" height="16" rx="2.5"></rect><path d="M8 2.5v4M16 2.5v4M3 9.5h18M12 13v5M9.5 15.5h5"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 1px">
<p style="margin: 0; color: #1f3a6e; font-size: 12.5px; font-weight: 700">Inscrições abertas</p>
<p style="margin: 0; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums">12 cursos começam até 27 de novembro</p>
</div>
</div>
<ul style="display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<li>
<a class="row" href="#" aria-label="{{g.label}}">
<sc-if value="{{g.hasCrest}}" hint-placeholder-val="{{true}}">
<span class="slot"><dc-import name="Crest" kind="{{g.crest}}" c1="{{g.c1}}" c2="{{g.c2}}" size="28" hint-size="28px,31px"></dc-import></span>
</sc-if>
<sc-if value="{{g.noCrest}}" hint-placeholder-val="{{false}}">
<span class="slot slot-empty"></span>
</sc-if>
<span class="pname">
<span class="pcat">{{g.name}}</span>
<sc-if value="{{g.one}}" hint-placeholder-val="{{false}}">
<span class="psub">{{g.course}}</span>
</sc-if>
</span>
<span class="count">{{g.count}}</span>
</a>
</li>
</sc-for>
</ul>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 6px 0; border-top: 1px solid #e3e7ee">
<a href="#" style="font-size: 13.5px; font-weight: 600">Ver todos os cursos abertos</a>
<button type="button" aria-label="Ocultar até o próximo acesso" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px; border: 1px solid rgba(31,58,122,.22); border-radius: 8px; background: rgba(31,58,122,.06); color: #1f3a6e; font: inherit; font-size: 12.5px; font-weight: 700">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"></path></svg>
<span>Ocultar</span>
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const groups = [
      { name: 'Centro de Análise, Planejamento e Estatística', count: 4, crest: 'bars', c1: '#1d3b78', c2: '#d8a93b' },
      { name: 'Escola de Governo e Gestão Pública', count: 3, crest: 'seal', c1: '#7a1f2b', c2: '#e9c46a' },
      { name: 'Diretoria de Tecnologia da Informação', count: 2, crest: 'chevron', c1: '#1f6b52', c2: '#eef4f0' },
      { name: 'Coordenadoria de Saúde e Segurança do Trabalho', count: 2, crest: null },
      { name: 'Instituto de Formação Continuada', count: 1, crest: 'chevron', c1: '#5b3a8c', c2: '#f0c75e', one: true, course: 'Redação Oficial e Linguagem Simples' },
    ];
    return {
      groups: groups.map((g) => ({
        ...g,
        one: !!g.one,
        hasCrest: !!g.crest,
        noCrest: !g.crest,
        label: g.one ? undefined : g.name + ': ' + g.count + ' cursos com inscrição aberta',
      })),
    };
  }
}
</script>
</body>
</html>
