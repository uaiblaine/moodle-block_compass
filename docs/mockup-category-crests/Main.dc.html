<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Inscrições abertas com brasão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#1d2125}
a{color:#1f3a7a}a:hover{color:#152a5c}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-height:40px;box-sizing:border-box;padding:0 6px 0 8px;border:1px solid #dee2e6;border-radius:999px;background:#ffffff;box-shadow:0 1px 2px rgba(16,24,40,.06);color:#1d2125;font-size:14px;text-decoration:none;transition:border-color 120ms ease-out}
.chip:hover{border-color:#1f3a7a;color:#1d2125;text-decoration:none}
.chip:focus-visible{outline:2px solid #1f3a7a;outline-offset:2px}
.chip.chip-nocrest{padding-left:14px}
.crestbox{display:inline-grid;flex:none;place-items:center;width:24px;height:26px}
.gname{min-width:0;max-width:12.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{display:inline-grid;flex:none;place-items:center;min-width:26px;height:26px;box-sizing:border-box;padding:0 7px;border-radius:13px;background:#e3e9f5;color:#1f3a6e;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:700}
.more{min-height:40px;padding:0 14px;border:1px dashed #ced4da;border-radius:999px;background:#ffffff;color:#1f3a6e;font:inherit;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.more:hover{border-color:#1f3a7a}
.tip{position:absolute;left:50%;bottom:calc(100% + 12px);z-index:5;display:flex;align-items:center;gap:12px;width:max-content;max-width:300px;box-sizing:border-box;padding:12px 16px 12px 12px;border:1px solid rgba(31,58,122,.14);border-radius:12px;background:#ffffff;box-shadow:0 1px 2px rgba(16,24,40,.06),0 14px 32px -8px rgba(16,24,40,.28);transform:translateX(-50%);pointer-events:auto}
.tip.tip-nocrest{padding-left:16px}
.tipcrest{display:grid;flex:none;place-items:center;width:52px;height:56px;border-radius:10px;background:#f4f6fa}
.tipname{margin:0;color:#1d2125;font-size:14px;font-weight:650;line-height:1.35;text-wrap:balance}
.tipmeta{display:flex;align-items:center;gap:6px;margin:5px 0 0;color:#5b6470;font-size:12.5px;line-height:1.3}
.tipdot{width:6px;height:6px;border-radius:3px;background:#2e7d4f;flex:none}
.tiparrow{position:absolute;left:50%;bottom:-7px;width:12px;height:12px;border-right:1px solid rgba(31,58,122,.14);border-bottom:1px solid rgba(31,58,122,.14);background:#ffffff;transform:translateX(-50%) rotate(45deg)}
.hide{position:absolute;top:16px;right:18px;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 9px;border:1px solid rgba(31,58,122,.22);border-radius:8px;background:rgba(31,58,122,.06);color:#1f3a6e;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.hide:hover{background:rgba(31,58,122,.12)}
</style>
</helmet>
<div style="width: 1120px; height: 440px; box-sizing: border-box; padding: 48px; background: #eef0f4">
<div style="box-sizing: border-box; padding: 22px 26px 26px; border: 1px solid #dee2e6; border-radius: 8px; background: #ffffff">
<h2 style="margin: 0 0 6px; font-size: 18px; font-weight: 600; color: #1d2125">Compass</h2>
<section aria-labelledby="news-title" style="position: relative; display: flex; flex-direction: column; gap: 14px; margin-top: 12px; padding: 18px 22px 20px; border: 1px solid #e9ecef; border-radius: 16px; background: linear-gradient(135deg, #fdfbf7 0%, #ffffff 60%, #e8edf7 100%)">
<div style="display: flex; align-items: center; gap: 14px; padding-right: 118px">
<span aria-hidden="true" style="display: inline-grid; flex: none; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: #e8edf7; box-shadow: inset 0 0 0 1px rgba(31,58,122,.14); color: #1f3a6e">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4.5" width="18" height="16" rx="2.5"></rect><path d="M8 2.5v4M16 2.5v4M3 9.5h18M12 13v5M9.5 15.5h5"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<h3 id="news-title" style="margin: 0; color: #1f3a6e; font-size: 13px; font-weight: 700; line-height: 1.4">Inscrições abertas</h3>
<span style="color: #1d2125; font-size: 16.5px; font-weight: 650; line-height: 1.3; font-variant-numeric: tabular-nums">12 cursos começam até 27 de novembro</span>
</div>
</div>
<button type="button" class="hide" aria-label="Ocultar até o próximo acesso">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"></path></svg>
<span>Ocultar</span>
</button>
<ul style="display: flex; flex-wrap: wrap; gap: 8px 10px; min-width: 0; margin: 0; padding: 0 0 0 54px; list-style: none">
<sc-for list="{{line}}" as="g" hint-placeholder-count="3">
<li style="position: relative; min-width: 0; max-width: 100%">
<a class="{{g.chipClass}}" href="#" aria-label="{{g.label}}" onMouseEnter="{{g.enter}}" onMouseLeave="{{g.leave}}" onFocus="{{g.enter}}" onBlur="{{g.leave}}" onKeyDown="{{g.key}}">
<sc-if value="{{g.hasCrest}}" hint-placeholder-val="{{true}}">
<span class="crestbox"><dc-import name="Crest" kind="{{g.crest}}" c1="{{g.c1}}" c2="{{g.c2}}" size="22" hint-size="22px,24px"></dc-import></span>
</sc-if>
<span class="gname">{{g.name}}</span>
<span class="count">{{g.count}}</span>
</a>
<sc-if value="{{g.tipOn}}" hint-placeholder-val="{{false}}">
<div class="{{g.tipClass}}" aria-hidden="true">
<sc-if value="{{g.hasCrest}}" hint-placeholder-val="{{true}}">
<span class="tipcrest"><dc-import name="Crest" kind="{{g.crest}}" c1="{{g.c1}}" c2="{{g.c2}}" size="40" hint-size="40px,44px"></dc-import></span>
</sc-if>
<div style="min-width: 0">
<p class="tipname">{{g.name}}</p>
<p class="tipmeta"><span class="tipdot"></span><span>{{g.meta}}</span></p>
</div>
<span class="tiparrow"></span>
</div>
</sc-if>
</li>
</sc-for>
<li>
<button type="button" class="more" aria-haspopup="dialog" aria-expanded="false">+{{more}}</button>
</li>
</ul>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"crests":{"editor":"boolean","default":true,"section":"Tema Dimensions"},"$preview":{"width":1120,"height":440}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tip: 'cape' };
  }
  renderVals() {
    const crests = this.props.crests ?? true;
    const tip = this.state.tip;
    const groups = [
      { id: 'cape', name: 'Centro de Análise, Planejamento e Estatística', count: 4, crest: 'bars', c1: '#1d3b78', c2: '#d8a93b' },
      { id: 'egov', name: 'Escola de Governo e Gestão Pública', count: 3, crest: 'seal', c1: '#7a1f2b', c2: '#e9c46a' },
      { id: 'dti', name: 'Diretoria de Tecnologia da Informação', count: 2, crest: 'chevron', c1: '#1f6b52', c2: '#eef4f0' },
      { id: 'csst', name: 'Coordenadoria de Saúde e Segurança do Trabalho', count: 2, crest: null },
      { id: 'ifc', name: 'Instituto de Formação Continuada', count: 1, crest: 'chevron', c1: '#5b3a8c', c2: '#f0c75e' },
    ];
    const all = groups.map((g) => {
      const has = crests && !!g.crest;
      const meta = g.count === 1 ? '1 curso com inscrição aberta' : g.count + ' cursos com inscrição aberta';
      return {
        ...g,
        hasCrest: has,
        chipClass: has ? 'chip' : 'chip chip-nocrest',
        tipClass: has ? 'tip' : 'tip tip-nocrest',
        tipOn: tip === g.id,
        meta: meta,
        label: g.name + ': ' + meta,
        enter: () => this.setState({ tip: g.id }),
        leave: () => this.setState({ tip: '' }),
        key: (e) => { if (e.key === 'Escape') { this.setState({ tip: '' }); } },
      };
    });
    return { line: all.slice(0, 3), more: all.length - 3 };
  }
}
</script>
</body>
</html>
